<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048 DOGS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:
        radial-gradient(circle at top, #1d2333 0%, #0c0d13 60%, #07080c 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:white;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
}

body{
    position:fixed;
    inset:0;
}

#gameWrap{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

/* ===================== TOP UI ===================== */

#topUI{
    position:absolute;
    top:14px;
    left:14px;
    right:14px;
    display:flex;
    justify-content:space-between;
    z-index:30;
}

.uiCard{
    min-width:78px;
    padding:12px 18px;
    border-radius:22px;

    background:rgba(30,30,36,.58);
    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 8px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.05);

    text-align:center;
    font-weight:900;
}

#difficulty{
    font-size:14px;
    color:#c5c5cb;
}

/* ===================== START / RESULT ===================== */

#startScreen,
#resultScreen{
    position:absolute;
    inset:0;
    z-index:50;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.72);
    backdrop-filter:blur(28px);
}

.start-card,
.resultCard{
    width:340px;
    max-width:90vw;

    padding:28px;

    border-radius:28px;

    background:rgba(28,28,34,.72);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(30px);

    box-shadow:0 25px 80px rgba(0,0,0,.55);

    text-align:center;
}

.playBtn,
.resultBtn{
    width:100%;
    margin-top:18px;

    border:none;
    border-radius:18px;

    padding:16px;

    font-size:18px;
    font-weight:900;

    background:#d7d7dc;
    color:#111;

    cursor:pointer;
}

.playBtn:active,
.resultBtn:active{
    transform:scale(.97);
}

.adBanner{
    width:100%;
    overflow:hidden;
    border-radius:18px;
    margin-bottom:12px;
}

/* ===================== GAME ===================== */

#gameContainer{
    width:100%;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
    position:relative;
}

/* DOG IMAGE */

#dogMascot{
    position:absolute;

    width:210px;

    top:70px;

    z-index:0;

    pointer-events:none;

    opacity:.98;

    filter:
        drop-shadow(0 20px 40px rgba(0,0,0,.55));
}

/* INFO */

.infoRow{
    width:320px;
    max-width:92vw;

    display:flex;
    gap:12px;

    z-index:2;
}

.infoBox{
    flex:1;

    padding:12px;

    border-radius:18px;

    background:rgba(24,24,30,.55);

    border:1px solid rgba(255,255,255,.06);

    backdrop-filter:blur(20px);

    text-align:center;
}

.label{
    font-size:12px;
    opacity:.6;
    margin-bottom:4px;
}

.value{
    font-size:24px;
    font-weight:900;
}

/* ===================== GRID ===================== */

#grid{
    width:320px;
    height:320px;

    max-width:92vw;
    max-height:92vw;

    padding:12px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;

    position:relative;
    z-index:2;

    border-radius:28px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.03),
            rgba(255,255,255,.01)
        );

    border:1px solid rgba(255,255,255,.06);

    backdrop-filter:blur(20px);

    box-shadow:
        0 15px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.04);
}

.tile{
    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
    font-size:30px;

    transition:.12s;

    animation:appear .14s ease;

    background:rgba(255,255,255,.06);

    color:white;
}

@keyframes appear{
    from{
        transform:scale(.4);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* TILES */

.tile-2{
    background:#eee4da;
    color:#776e65;
}

.tile-4{
    background:#ede0c8;
    color:#776e65;
}

.tile-8{
    background:#f2b179;
}

.tile-16{
    background:#f59563;
}

.tile-32{
    background:#f67c5f;
}

.tile-64{
    background:#f65e3b;
}

.tile-128{
    background:#edcf72;
    font-size:24px;
}

.tile-256{
    background:#edcc61;
    font-size:24px;
}

.tile-512{
    background:#edc850;
    font-size:24px;
}

.tile-1024{
    background:#edc53f;
    font-size:20px;
}

.tile-2048{
    background:#edc22e;
    font-size:20px;
}

/* RESULT */

.resultTitle{
    font-size:34px;
    font-weight:900;
    margin-bottom:12px;
}

.resultText{
    opacity:.8;
    line-height:1.5;
    margin-bottom:16px;
}

.waitBox{
    padding:18px;
    border-radius:20px;

    background:rgba(255,255,255,.04);

    margin-bottom:16px;
}

#claimTimer{
    font-size:34px;
    font-weight:900;
    margin-top:10px;
}

/* LOADING */

#loading{
    position:absolute;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:black;

    font-size:24px;
    font-weight:900;
}

</style>
</head>

<body>

<div id="gameWrap">

    <div id="loading">Loading...</div>

    <!-- TOP -->
    <div id="topUI">
        <div class="uiCard">
            <div id="timer">60</div>
        </div>

        <div class="uiCard">
            <div id="difficulty">EASY</div>
        </div>
    </div>

    <!-- START -->
    <div id="startScreen">

        <div class="adBanner" style="width:300px;max-width:90vw;">
            <iframe data-aa='2438445'
                    src='//acceptable.a-ads.com/2438445/?size=Adaptive'
                    style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'>
            </iframe>
        </div>

        <div class="start-card">

            <div style="font-size:42px;font-weight:900;margin-bottom:10px;">
                2048 DOGS
            </div>

            <div id="startInfo"
                 style="line-height:1.6;color:#9a9aa1;">
            </div>

            <button class="playBtn" onclick="startGame()">
                PLAY
            </button>

        </div>
    </div>

    <!-- GAME -->
    <div id="gameContainer">

        <!-- DOG -->
        <img id="dogMascot"
             src="dog.png"
             alt="dog">

        <!-- INFO -->
        <div class="infoRow">

            <div class="infoBox">
                <div class="label">Score</div>
                <div class="value" id="score">0</div>
            </div>

            <div class="infoBox">
                <div class="label">Target tile</div>
                <div class="value" id="targetVal">≥256</div>
            </div>

        </div>

        <!-- GRID -->
        <div id="grid"></div>

    </div>

    <!-- RESULT -->
    <div id="resultScreen" style="display:none;">

        <div class="resultCard">

            <div class="resultTitle" id="resultTitle"></div>

            <div class="resultText" id="resultText"></div>

            <div id="winBlock" style="display:none;">

                <div class="waitBox">
                    Reward is being credited...
                    <div id="claimTimer">5</div>
                </div>

            </div>

            <div class="adBanner">
                <iframe data-aa='2438445'
                        src='//acceptable.a-ads.com/2438445/?size=Adaptive'
                        style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'>
                </iframe>
            </div>

            <button class="resultBtn"
                    onclick="goHome()"
                    id="homeBtn">
                RETURN HOME
            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   TELEGRAM FIXES
========================= */

document.body.addEventListener(
    'touchmove',
    function(e){
        if(e.scale !== 1){
            e.preventDefault();
        }
    },
    { passive:false }
);

document.addEventListener(
    'gesturestart',
    function(e){
        e.preventDefault();
    }
);

const tg = window.Telegram?.WebApp;

tg?.expand?.();

if(tg){
    tg.disableVerticalSwipes();
}

/* =========================
   API
========================= */

const API = "https://dogs-7ntt.onrender.com";

const sessionToken =
    new URLSearchParams(window.location.search)
        .get("session_token");

const initDataFromUrl =
    new URLSearchParams(window.location.search)
        .get("init_data");

let finishSent = false;

/* =========================
   GAME VARS
========================= */

let gameDifficulty = 1;
let targetScore = 256;
let timeLimit = 60;

let currentScore = 0;

let gameActive = false;

let timerInterval = null;

let timeLeft = 0;

let grid = [];

const gridContainer = document.getElementById("grid");

const difficultyNames = {
    1:"EASY",
    2:"MEDIUM",
    3:"HARD"
};

/* =========================
   INIT
========================= */

function hideLoading(){
    document.getElementById("loading").style.display = "none";
}

setTimeout(hideLoading,1000);

async function init(){

    if(!sessionToken){

        document.querySelector(".playBtn").disabled = true;

        document.querySelector(".playBtn").innerText =
            "OPEN FROM GAMEHUB";

        return;
    }

    try{

        const res = await fetch(API + "/games/2048/start",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                init_data:initDataFromUrl || tg?.initData || ""
            })
        });

        const data = await res.json();

        if(!data.ok){

            document.querySelector(".playBtn").disabled = true;

            document.querySelector(".playBtn").innerText =
                data.error || "ERROR";

            return;
        }

        gameDifficulty = data.difficulty;
        targetScore = data.target_score;
        timeLimit = data.time_limit;

        document.getElementById("difficulty").innerText =
            difficultyNames[gameDifficulty];

        document.getElementById("startInfo").innerHTML = `
            Difficulty: <b>${difficultyNames[gameDifficulty]}</b><br>
            Target tile: <b>≥${targetScore}</b><br>
            Time: <b>${timeLimit}s</b><br>
            Reward: <b>${ {1:5,2:7,3:10}[gameDifficulty] } DOGS</b>
        `;

    }catch(e){
        console.error(e);
    }
}

init();

/* =========================
   START GAME
========================= */

function startGame(){

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("gameContainer").style.display = "flex";

    document.getElementById("targetVal").innerText =
        "≥" + targetScore;

    resetGame();

    gameActive = true;

    startTimer();
}

/* =========================
   RESET
========================= */

function resetGame(){

    grid = Array(4)
        .fill()
        .map(() => Array(4).fill(0));

    addRandomTile();
    addRandomTile();

    currentScore = 0;

    updateGrid();
}

/* =========================
   RANDOM TILE
========================= */

function addRandomTile(){

    let empty = [];

    for(let i=0;i<4;i++){

        for(let j=0;j<4;j++){

            if(grid[i][j] === 0){

                empty.push([i,j]);
            }
        }
    }

    if(empty.length){

        let [r,c] =
            empty[Math.floor(Math.random()*empty.length)];

        grid[r][c] =
            Math.random() < 0.9 ? 2 : 4;
    }
}

/* =========================
   DRAW GRID
========================= */

function updateGrid(){

    gridContainer.innerHTML = "";

    for(let i=0;i<4;i++){

        for(let j=0;j<4;j++){

            const tile = document.createElement("div");

            tile.className = "tile";

            if(grid[i][j] !== 0){

                tile.textContent = grid[i][j];

                tile.classList.add(`tile-${grid[i][j]}`);
            }

            gridContainer.appendChild(tile);
        }
    }

    document.getElementById("score").innerText =
        currentScore;
}

/* =========================
   CHECK TARGET
========================= */

function hasTargetTile(){

    for(let i=0;i<4;i++){

        for(let j=0;j<4;j++){

            if(grid[i][j] >= targetScore){

                return true;
            }
        }
    }

    return false;
}

/* =========================
   MOVE
========================= */

function move(direction){

    if(!gameActive) return;

    let moved = false;

    let newGrid =
        JSON.parse(JSON.stringify(grid));

    const vectors = [
        [-1,0],
        [0,1],
        [1,0],
        [0,-1]
    ];

    const [dr,dc] = vectors[direction];

    let rowStart =
        dr === 1 ? 3 : 0;

    let rowEnd =
        dr === 1 ? -1 : 4;

    let rowStep =
        dr === 1 ? -1 : 1;

    let colStart =
        dc === 1 ? 3 : 0;

    let colEnd =
        dc === 1 ? -1 : 4;

    let colStep =
        dc === 1 ? -1 : 1;

    for(
        let i=rowStart;
        i!==rowEnd;
        i+=rowStep
    ){

        for(
            let j=colStart;
            j!==colEnd;
            j+=colStep
        ){

            if(newGrid[i][j]===0) continue;

            let r=i;
            let c=j;

            while(true){

                let nr=r+dr;
                let nc=c+dc;

                if(
                    nr<0 ||
                    nr>=4 ||
                    nc<0 ||
                    nc>=4
                ){
                    break;
                }

                if(newGrid[nr][nc]===0){

                    newGrid[nr][nc]=newGrid[r][c];

                    newGrid[r][c]=0;

                    r=nr;
                    c=nc;

                    moved=true;
                }

                else if(
                    newGrid[nr][nc] === newGrid[r][c]
                ){

                    newGrid[nr][nc] *= 2;

                    currentScore += newGrid[nr][nc];

                    newGrid[r][c] = 0;

                    moved = true;

                    break;
                }

                else{
                    break;
                }
            }
        }
    }

    if(moved){

        grid = newGrid;

        addRandomTile();

        updateGrid();

        checkGameOver();
    }
}

/* =========================
   GAME OVER
========================= */

function checkGameOver(){

    for(let i=0;i<4;i++){

        for(let j=0;j<4;j++){

            if(grid[i][j]===0) return;

            if(
                j<3 &&
                grid[i][j]===grid[i][j+1]
            ){
                return;
            }

            if(
                i<3 &&
                grid[i][j]===grid[i+1][j]
            ){
                return;
            }
        }
    }

    endGame(true);
}

/* =========================
   TIMER
========================= */

function startTimer(){

    timeLeft = timeLimit;

    document.getElementById("timer").innerText =
        timeLeft;

    clearInterval(timerInterval);

    timerInterval = setInterval(()=>{

        timeLeft--;

        document.getElementById("timer").innerText =
            timeLeft;

        if(timeLeft <= 0){

            clearInterval(timerInterval);

            endGame(false);
        }

    },1000);
}

/* =========================
   END GAME
========================= */

async function endGame(){

    if(!gameActive || finishSent) return;

    gameActive = false;

    clearInterval(timerInterval);

    const survived = hasTargetTile();

    const score = currentScore;

    finishSent = true;

    try{

        const res =
            await fetch(API + "/games/2048/finish",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                init_data:initDataFromUrl || tg?.initData || "",
                session_token:sessionToken,
                score:score,
                survived:survived
            })

        });

        const data = await res.json();

        showResult(data);

    }catch(e){

        console.error(e);

        showResult({
            ok:false,
            error:"network"
        });
    }
}

/* =========================
   RESULT
========================= */

function showResult(data){

    document.getElementById("gameContainer").style.display =
        "none";

    document.getElementById("resultScreen").style.display =
        "flex";

    const titleEl =
        document.getElementById("resultTitle");

    const textEl =
        document.getElementById("resultText");

    const homeBtn =
        document.getElementById("homeBtn");

    const winBlock =
        document.getElementById("winBlock");

    const claimTimer =
        document.getElementById("claimTimer");

    if(data.ok && data.win){

        titleEl.innerText = "YOU WON 🎉";

        textEl.innerText =
            `+${data.reward} DOGS added to your balance!`;

        winBlock.style.display = "block";

        homeBtn.style.display = "none";

        let wait = 5;

        claimTimer.innerText = wait;

        const rewardTimer = setInterval(()=>{

            wait--;

            claimTimer.innerText = wait;

            if(wait <= 0){

                clearInterval(rewardTimer);

                homeBtn.style.display = "block";

                winBlock.style.display = "none";
            }

        },1000);

    }else{

        titleEl.innerText = "YOU LOST";

        textEl.innerText =
            `You didn't reach tile ≥ ${targetScore}. Score: ${currentScore}`;

        homeBtn.style.display = "block";

        winBlock.style.display = "none";
    }
}

/* =========================
   HOME
========================= */

function goHome(){
    window.location.href = "../../";
}

/* =========================
   TOUCH CONTROLS
========================= */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener(
    "touchstart",
    e => {

        if(!gameActive) return;

        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    },
    { passive:true }
);

document.addEventListener(
    "touchend",
    e => {

        if(!gameActive) return;

        let dx =
            e.changedTouches[0].clientX - touchStartX;

        let dy =
            e.changedTouches[0].clientY - touchStartY;

        if(
            Math.abs(dx) < 30 &&
            Math.abs(dy) < 30
        ){
            return;
        }

        if(Math.abs(dx) > Math.abs(dy)){

            move(dx > 0 ? 1 : 3);

        }else{

            move(dy > 0 ? 2 : 0);
        }
    },
    { passive:true }
);

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e => {

        if(!gameActive) return;

        if(e.key === "ArrowUp"){
            move(0);
        }

        else if(e.key === "ArrowRight"){
            move(1);
        }

        else if(e.key === "ArrowDown"){
            move(2);
        }

        else if(e.key === "ArrowLeft"){
            move(3);
        }
    }
);

</script>
</body>
</html>
