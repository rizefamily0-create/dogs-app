<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>2048 DOGS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            overscroll-behavior: none;
            background: radial-gradient(ellipse at 50% 0%, #1a1b24 0%, #0f1015 55%, #0a0b0f 100%);
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            color: #f5f5f7;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        .glass-card {
            background: rgba(28, 28, 32, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 18px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        }
        #gameWrap {
            position: relative; width: 100vw; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        /* Лапки-декор (добавляются через JS) */
        .paw-decor {
            position: absolute;
            pointer-events: none;
            opacity: 0.1;
            z-index: 0;
            font-size: 30px;
            user-select: none;
        }
        #topUI {
            position: absolute; top: 14px; left: 14px; right: 14px;
            display: flex; justify-content: space-between; gap: 10px; z-index: 20;
        }
        .uiCard {
            background: rgba(28, 28, 32, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px; padding: 10px 18px;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900; min-width: 70px;
        }
        #timer { color: #fff; }
        #difficulty { font-size: 14px; color: #c0c0c0; font-weight: 800; }
        #startScreen, #resultScreen {
            position: absolute; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; padding: 20px; gap: 16px;
        }
        .start-card, .resultCard {
            background: rgba(28,28,32,0.7); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 32px 24px; backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px); box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center; width: 340px; max-width: 90vw;
        }
        .playBtn, .resultBtn {
            width: 100%; border: none; border-radius: 18px; padding: 16px;
            background: #c0c0c0; color: #1a1a1d; font-size: 18px; font-weight: 800;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 18px rgba(192,192,192,0.25);
            margin-top: 16px; letter-spacing: 0.5px;
        }
        .playBtn:active, .resultBtn:active { transform: scale(0.96); opacity: 0.85; }
        .adBanner {
            width: 100%; margin-bottom: 12px;
            border-radius: 16px;
            background: rgba(20, 20, 24, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        #gameContainer {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 0 20px;
            /* Фоновое изображение */
            background-image: url('bg.png'); /* замените на путь к вашей картинке */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        /* Полупрозрачная подложка, чтобы сетка не сливалась */
        #gameContainer::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 11, 15, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 0;
            border-radius: 18px;
        }
        .infoRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 320px;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .infoBox {
            flex: 1;
            background: rgba(28, 28, 32, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 12px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            color: #c0c0c0;
        }
        .infoBox .label { font-size: 12px; opacity: 0.6; margin-bottom: 4px; }
        .infoBox .value { font-size: 24px; font-weight: 900; color: #fff; }
        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 300px; height: 300px; max-width: 90vw; max-height: 90vw;
            padding: 10px;
            background: rgba(20,20,24,0.6);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: relative;
            z-index: 2;
            overflow: hidden;
        }
        .tile {
            background: rgba(60,60,70,0.4);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 900; color: #fff;
            transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
            position: relative;
            z-index: 1;
            animation: appear 0.15s ease;
        }
        @keyframes appear {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .tile.merged { animation: pop 0.15s ease; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .tile-2    { background: #eee4da; color: #776e65; }
        .tile-4    { background: #ede0c8; color: #776e65; }
        .tile-8    { background: #f2b179; color: #f9f6f2; }
        .tile-16   { background: #f59563; color: #f9f6f2; }
        .tile-32   { background: #f67c5f; color: #f9f6f2; }
        .tile-64   { background: #f65e3b; color: #f9f6f2; }
        .tile-128  { background: #edcf72; color: #f9f6f2; font-size: 24px; }
        .tile-256  { background: #edcc61; color: #f9f6f2; font-size: 24px; }
        .tile-512  { background: #edc850; color: #f9f6f2; font-size: 24px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 20px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 20px; }
        .waitBox {
            background: rgba(20, 20, 24, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #f5f5f7;
        }
        #claimTimer {
            font-size: 32px;
            font-weight: 900;
            color: #c0c0c0;
            margin-top: 8px;
        }
        #loading {
            position: absolute; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; font-size: 22px; font-weight: 800; color: #c0c0c0;
        }
    </style>
</head>
<body>
<div id="gameWrap">
    <div id="loading">Loading...</div>

    <div id="topUI">
        <div class="uiCard"><div id="timer">60</div></div>
        <div class="uiCard"><div id="difficulty">EASY</div></div>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen">
        <div class="adBanner" style="width:300px;max-width:90vw;">
            <iframe data-aa='2438445' src='//acceptable.a-ads.com/2438445/?size=Adaptive' style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'></iframe>
        </div>
        <div class="start-card">
            <div style="font-size:36px; font-weight:900; margin-bottom:12px;">2048</div>
            <div id="startInfo" style="margin-bottom:16px; line-height:1.5; color:#8e8e93;"></div>
            <button class="playBtn" onclick="startGame()">PLAY</button>
        </div>
    </div>

    <!-- GAME UI -->
    <div id="gameContainer">
        <div class="infoRow">
            <div class="infoBox">
                <div class="label">Score</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="infoBox">
                <div class="label">Target tile</div>
                <div class="value" id="targetVal">≥256</div>
            </div>
        </div>
        <div id="grid"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="resultScreen" style="display:none;">
        <div class="resultCard">
            <div class="resultTitle" id="resultTitle"></div>
            <div class="resultText" id="resultText"></div>
            <div id="winBlock" style="display:none;">
                <div class="waitBox">
                    Reward is being credited.<br>Please wait...
                    <div id="claimTimer">5</div>
                </div>
            </div>
            <div class="adBanner">
                <iframe data-aa='2438445' src='//acceptable.a-ads.com/2438445/?size=Adaptive' style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'></iframe>
            </div>
            <div class="adBanner">
                <iframe data-aa='2438445' src='//acceptable.a-ads.com/2438445/?size=Adaptive' style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'></iframe>
            </div>
            <button class="resultBtn" onclick="goHome()" id="homeBtn">RETURN HOME</button>
        </div>
    </div>
</div>

<script>
    // Блокировка свайпа вниз
    document.addEventListener('touchmove', function(e) {
        e.preventDefault();
    }, { passive: false });

    // Генерация декоративных лапок
    function createPaws() {
        const container = document.getElementById('gameWrap');
        const pawCount = 18;
        for (let i = 0; i < pawCount; i++) {
            const paw = document.createElement('div');
            paw.className = 'paw-decor';
            paw.textContent = '🐾';
            paw.style.left = Math.random() * 100 + '%';
            paw.style.top = Math.random() * 100 + '%';
            paw.style.fontSize = (20 + Math.random() * 30) + 'px';
            paw.style.opacity = 0.08 + Math.random() * 0.1;
            paw.style.transform = `rotate(${Math.random() * 360}deg)`;
            container.appendChild(paw);
        }
    }
    createPaws();

    const tg = window.Telegram?.WebApp;
    tg?.expand?.();
    const API = "https://dogs-7ntt.onrender.com";
    const sessionToken = new URLSearchParams(window.location.search).get("session_token");
    const initDataFromUrl = new URLSearchParams(window.location.search).get("init_data");
    let finishSent = false;

    let gameDifficulty = 1;
    let targetScore = 256;
    let timeLimit = 60;
    let currentScore = 0;
    let gameActive = false;
    let timerInterval = null;
    let timeLeft = 0;
    let grid = [];
    let gridContainer = document.getElementById("grid");

    const difficultyNames = {1: "EASY", 2: "MEDIUM", 3: "HARD"};

    function hideLoading() {
        document.getElementById("loading").style.display = "none";
    }
    setTimeout(hideLoading, 1500);

    async function init() {
        if (!sessionToken) {
            document.querySelector(".playBtn").disabled = true;
            document.querySelector(".playBtn").innerText = "OPEN FROM GAMEHUB";
            return;
        }
        try {
            const res = await fetch(API + "/games/2048/start", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({init_data: initDataFromUrl || tg?.initData || ""})
            });
            const data = await res.json();
            if (!data.ok) {
                document.querySelector(".playBtn").disabled = true;
                document.querySelector(".playBtn").innerText = data.error || "Error";
                return;
            }
            gameDifficulty = data.difficulty;
            targetScore = data.target_score;
            timeLimit = data.time_limit;
            document.getElementById("difficulty").innerText = difficultyNames[gameDifficulty];
            document.getElementById("startInfo").innerHTML = `
                Difficulty: <b>${difficultyNames[gameDifficulty]}</b><br>
                Target tile: <b>≥${targetScore}</b><br>
                Time: <b>${timeLimit}s</b><br>
                Reward: <b>${ {1:5,2:7,3:10}[gameDifficulty] } DOGS</b>
            `;
            hideLoading();
        } catch(e) {
            console.error(e);
        }
    }
    init();

    function startGame() {
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("gameContainer").style.display = "flex";
        document.getElementById("targetVal").innerText = "≥" + targetScore;
        resetGame();
        gameActive = true;
        startTimer();
    }

    function resetGame() {
        grid = Array(4).fill().map(() => Array(4).fill(0));
        addRandomTile();
        addRandomTile();
        currentScore = 0;
        updateGrid();
    }

    function addRandomTile() {
        let empty = [];
        for (let i=0; i<4; i++)
            for (let j=0; j<4; j++)
                if (grid[i][j]===0) empty.push([i,j]);
        if (empty.length>0) {
            let [r,c] = empty[Math.floor(Math.random()*empty.length)];
            grid[r][c] = Math.random()<0.9 ? 2 : 4;
        }
    }

    function updateGrid() {
        gridContainer.innerHTML = "";
        for (let i=0; i<4; i++) {
            for (let j=0; j<4; j++) {
                const tile = document.createElement("div");
                tile.className = "tile";
                if (grid[i][j] !== 0) {
                    tile.textContent = grid[i][j];
                    tile.classList.add(`tile-${grid[i][j]}`);
                }
                gridContainer.appendChild(tile);
            }
        }
        document.getElementById("score").innerText = currentScore;
    }

    function hasTargetTile() {
        for (let i=0; i<4; i++)
            for (let j=0; j<4; j++)
                if (grid[i][j] >= targetScore) return true;
        return false;
    }

    function move(direction) {
        if (!gameActive) return;
        let moved = false;
        let newGrid = JSON.parse(JSON.stringify(grid));
        const vectors = [[-1,0],[0,1],[1,0],[0,-1]];
        const [dr, dc] = vectors[direction];

        let rowStart = dr===1 ? 3 : 0, rowEnd = dr===1 ? -1 : 4, rowStep = dr===1 ? -1 : 1;
        let colStart = dc===1 ? 3 : 0, colEnd = dc===1 ? -1 : 4, colStep = dc===1 ? -1 : 1;

        for (let i=rowStart; i!==rowEnd; i+=rowStep) {
            for (let j=colStart; j!==colEnd; j+=colStep) {
                if (newGrid[i][j]===0) continue;
                let r = i, c = j;
                while (true) {
                    let nr = r + dr, nc = c + dc;
                    if (nr<0||nr>=4||nc<0||nc>=4) break;
                    if (newGrid[nr][nc]===0) {
                        newGrid[nr][nc] = newGrid[r][c];
                        newGrid[r][c] = 0;
                        r = nr; c = nc;
                        moved = true;
                    } else if (newGrid[nr][nc]===newGrid[r][c]) {
                        newGrid[nr][nc] *= 2;
                        currentScore += newGrid[nr][nc];
                        newGrid[r][c] = 0;
                        moved = true;
                        break;
                    } else {
                        break;
                    }
                }
            }
        }
        if (moved) {
            grid = newGrid;
            addRandomTile();
            updateGrid();
            checkGameOver();
        }
    }

    function checkGameOver() {
        for (let i=0; i<4; i++) {
            for (let j=0; j<4; j++) {
                if (grid[i][j]===0) return;
                if (j<3 && grid[i][j]===grid[i][j+1]) return;
                if (i<3 && grid[i][j]===grid[i+1][j]) return;
            }
        }
        endGame(true);
    }

    function startTimer() {
        timeLeft = timeLimit;
        document.getElementById("timer").innerText = timeLeft;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame(false);
            }
        }, 1000);
    }

    async function endGame(isStuck) {
        if (!gameActive || finishSent) return;
        gameActive = false;
        clearInterval(timerInterval);
        const survived = hasTargetTile();
        const score = currentScore;
        finishSent = true;

        try {
            const res = await fetch(API + "/games/2048/finish", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    init_data: initDataFromUrl || tg?.initData || "",
                    session_token: sessionToken,
                    score: score,
                    survived: survived
                })
            });
            const data = await res.json();
            showResult(data);
        } catch(e) {
            console.error(e);
            showResult({ok:false, error:"network"});
        }
    }

    function showResult(data) {
        document.getElementById("gameContainer").style.display = "none";
        document.getElementById("resultScreen").style.display = "flex";
        const titleEl = document.getElementById("resultTitle");
        const textEl = document.getElementById("resultText");
        const homeBtn = document.getElementById("homeBtn");
        const winBlock = document.getElementById("winBlock");
        const claimTimer = document.getElementById("claimTimer");

        if (data.ok && data.win) {
            titleEl.innerText = "YOU WON 🎉";
            textEl.innerText = `+${data.reward} DOGS added to your balance!`;
            winBlock.style.display = "block";
            homeBtn.style.display = "none";
            let wait = 5;
            claimTimer.innerText = wait;
            const rewardTimer = setInterval(() => {
                wait--;
                claimTimer.innerText = wait;
                if (wait <= 0) {
                    clearInterval(rewardTimer);
                    homeBtn.style.display = "block";
                    winBlock.style.display = "none";
                }
            }, 1000);
        } else {
            titleEl.innerText = "YOU LOST (>_<)";
            textEl.innerText = `You didn't reach tile ≥ ${targetScore}. Score: ${currentScore}`;
            if (data.error === "session_expired") textEl.innerText += "\nSession expired.";
            winBlock.style.display = "none";
            homeBtn.style.display = "block";
        }
    }

    function goHome() {
        window.location.href = "../../";
    }

    let touchStartX = 0, touchStartY = 0;
    document.addEventListener("touchstart", e => {
        if (!gameActive) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    });
    document.addEventListener("touchend", e => {
        if (!gameActive) return;
        let dx = e.changedTouches[0].clientX - touchStartX;
        let dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
        if (Math.abs(dx) > Math.abs(dy)) {
            move(dx > 0 ? 1 : 3);
        } else {
            move(dy > 0 ? 2 : 0);
        }
    });
    document.addEventListener("keydown", e => {
        if (!gameActive) return;
        if (e.key === "ArrowUp") move(0);
        else if (e.key === "ArrowRight") move(1);
        else if (e.key === "ArrowDown") move(2);
        else if (e.key === "ArrowLeft") move(3);
    });
</script>
</body>
</html>
