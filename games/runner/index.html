<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RUNNER DOGS</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(ellipse at 50% 0%, #1a1b24 0%, #0f1015 55%, #0a0b0f 100%);
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            color: #f5f5f7;
            touch-action: none;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameWrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        #topUI {
            position: absolute; top: 14px; left: 14px; right: 14px;
            display: flex; justify-content: space-between; gap: 10px; z-index: 20;
        }
        .uiCard {
            background: rgba(28, 28, 32, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px; padding: 10px 18px;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900; min-width: 70px;
        }
        #timer { color: #fff; }
        #difficulty { font-size: 14px; color: #c0c0c0; font-weight: 800; }
        #startScreen, #resultScreen {
            position: absolute; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; padding: 20px; gap: 16px;
        }
        .start-card, .resultCard {
            background: rgba(28,28,32,0.7); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 32px 24px; backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px); box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center; width: 340px; max-width: 90vw;
        }
        .playBtn, .resultBtn {
            width: 100%; border: none; border-radius: 18px; padding: 16px;
            background: #c0c0c0; color: #1a1a1d; font-size: 18px; font-weight: 800;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 18px rgba(192,192,192,0.25);
            margin-top: 16px; letter-spacing: 0.5px;
        }
        .playBtn:active, .resultBtn:active { transform: scale(0.96); opacity: 0.85; }
        .adBanner {
            width: 100%; margin-bottom: 12px; border-radius: 16px;
            background: rgba(20, 20, 24, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .waitBox {
            background: rgba(20,20,24,0.55); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px; padding: 18px; text-align: center; margin-bottom: 16px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            color: #f5f5f7;
        }
        #claimTimer { font-size: 32px; font-weight: 900; color: #c0c0c0; margin-top: 8px; }
        #loading {
            position: absolute; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; font-size: 22px; font-weight: 800; color: #c0c0c0;
        }
        .start-ad { width: 300px; max-width: 90vw; margin-bottom: 16px; }
    </style>
</head>
<body>
<div id="gameWrap">
    <div id="loading">Loading...</div>
    <div id="topUI">
        <div class="uiCard"><div id="timer">40</div></div>
        <div class="uiCard"><div id="difficulty">EASY</div></div>
    </div>

    <div id="startScreen">
        <div class="adBanner start-ad">
            <iframe data-aa='2438445' src='//acceptable.a-ads.com/2438445/?size=Adaptive' style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'></iframe>
        </div>
        <div class="start-card">
            <div style="font-size:36px;font-weight:900;margin-bottom:12px;">Runner DOGS</div>
            <div id="subtitle"></div>
            <button class="playBtn" onclick="startGame()">PLAY</button>
        </div>
    </div>

    <div id="resultScreen" style="display:none;">
        <div class="resultCard">
            <div class="resultTitle" id="resultTitle"></div>
            <div class="resultText" id="resultText"></div>
            <div class="adBanner">
                <iframe data-aa='2438445' src='//acceptable.a-ads.com/2438445/?size=Adaptive' style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'></iframe>
            </div>
            <div class="adBanner">
                <iframe data-aa='2438445' src='//acceptable.a-ads.com/2438445/?size=Adaptive' style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'></iframe>
            </div>
            <div id="winBlock" style="display:none;">
                <div class="waitBox">Reward is being credited.<br>Please wait...<div id="claimTimer">5</div></div>
            </div>
            <button class="resultBtn" onclick="goHome()" id="homeBtn">RETURN HOME</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    // ========== LOCALE ==========
    const currentLang = localStorage.getItem('lang') || 'en';
    const LOCALE = {
        ru: {
            loading: "Загрузка...",
            play: "ИГРАТЬ",
            difficulty: {1:"ЛЕГКО",2:"СРЕДНЕ",3:"СЛОЖНО"},
            survive: "Продержитесь",
            reward: "Награда",
            sec: "с",
            lost_title: "ВЫ ПРОИГРАЛИ (>_<)",
            lost_text: "Вы разбились!",
            win_title: "ВЫ ВЫИГРАЛИ 🎉",
            win_text: "Вы выжили! Награда:",
            session_expired: "Сессия истекла.",
            invalid_session: "Неверная игровая сессия.",
            already_completed: "Забег уже завершён.",
            wait_text: "Награда начисляется.<br>Пожалуйста, подождите...",
            home_btn: "ВЕРНУТЬСЯ ДОМОЙ",
            open_from_hub: "ОТКРОЙТЕ ИЗ GAMEHUB"
        },
        en: {
            loading: "Loading...",
            play: "PLAY",
            difficulty: {1:"EASY",2:"MEDIUM",3:"HARD"},
            survive: "Survive",
            reward: "Reward",
            sec: "s",
            lost_title: "YOU LOST (>_<)",
            lost_text: "You crashed!",
            win_title: "YOU WON 🎉",
            win_text: "You survived! Reward:",
            session_expired: "Session expired.",
            invalid_session: "Invalid game session.",
            already_completed: "Run already completed.",
            wait_text: "Reward is being credited.<br>Please wait...",
            home_btn: "RETURN HOME",
            open_from_hub: "OPEN FROM GAMEHUB"
        }
    };
    function t(key) { return LOCALE[currentLang]?.[key] ?? key; }
    function td(key) { return LOCALE[currentLang]?.difficulty?.[key] ?? key; }

    document.getElementById('loading').innerText = t('loading');
    document.querySelector('.playBtn').innerText = t('play');
    document.getElementById('homeBtn').innerText = t('home_btn');

    const tg = window.Telegram?.WebApp;
    tg?.expand?.();
    const ExitAdController = window.Adsgram.init({ blockId: "int-31473" });

    const API = "https://dogs-7ntt.onrender.com";
    const sessionToken = new URLSearchParams(window.location.search).get("session_token");
    const initDataFromUrl = new URLSearchParams(window.location.search).get("init_data");
    let finishSent = false;

    let gameDifficulty = 1;
    let surviveTimeGoal = 40;
    let expectedReward = 5;
    const rewardMap = {1:5, 2:7, 3:10};

    // ========== ЗАГРУЗКА ИЗОБРАЖЕНИЙ ==========
    const playerImg = new Image();
    const enemyImg = new Image();
    const barrierImg = new Image();
    const bgImg = new Image();

    let loadedImages = 0;
    const TOTAL_IMAGES = 4;
    let imagesReady = false;

    function imageLoaded() {
        loadedImages++;
        if (loadedImages >= TOTAL_IMAGES) {
            imagesReady = true;
            if (document.getElementById('loading').style.display !== 'none') {
                document.getElementById('loading').style.display = 'none';
            }
        }
    }

    playerImg.onload = imageLoaded;
    enemyImg.onload = imageLoaded;
    barrierImg.onload = imageLoaded;
    bgImg.onload = imageLoaded;
    playerImg.onerror = imageLoaded;
    enemyImg.onerror = imageLoaded;
    barrierImg.onerror = imageLoaded;
    bgImg.onerror = imageLoaded;

    playerImg.src = "player.png";
    enemyImg.src = "enemy.png";
    barrierImg.src = "barrier.png";
    bgImg.src = "city-bg.png";

    // ========== ИНИЦИАЛИЗАЦИЯ С СЕРВЕРА ==========
    async function init() {
        if (!sessionToken) {
            document.querySelector(".playBtn").disabled = true;
            document.querySelector(".playBtn").innerText = t('open_from_hub');
            return;
        }
        try {
            const res = await fetch(API + "/games/runner/start", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ init_data: initDataFromUrl || tg?.initData || "" })
            });
            const data = await res.json();
            if (!data.ok) {
                document.querySelector(".playBtn").disabled = true;
                document.querySelector(".playBtn").innerText = data.error || "Error";
                return;
            }
            gameDifficulty = data.difficulty;
            surviveTimeGoal = data.survive_time;
            expectedReward = rewardMap[gameDifficulty];
            document.getElementById('difficulty').innerText = td(gameDifficulty);
            document.getElementById('subtitle').innerHTML = `
                ${t('survive')}: <b>${surviveTimeGoal}${t('sec')}</b><br>
                ${t('reward')}: <b>${expectedReward} DOGS</b>
            `;
            if (imagesReady) document.getElementById('loading').style.display = 'none';
        } catch (e) {
            console.error("Init error:", e);
            document.getElementById('loading').style.display = 'none';
        }
    }
    init();

    // ========== CANVAS ==========
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() { W = window.innerWidth; H = window.innerHeight; canvas.width = W; canvas.height = H; }
    window.addEventListener('resize', resize);
    resize();

    const HORIZON_Y = 0.25;          // удлинённая дорога
    const ROAD_TOP_WIDTH = 0.50;
    const ROAD_BOTTOM_WIDTH = 0.90;

    let gameRunning = false;
    let timeLeft = 40;
    let safeTimer = 0;
    let playerLane = 0, targetLane = 0, slideTimer = 0;
    let obstacles = [];
    let spawnCooldown = 0;
    let roadScroll = 0;

    function getRoadEdges(depth) {
        const p = Math.min(1, Math.max(0, depth));
        const topW = W * ROAD_TOP_WIDTH;
        const bottomW = W * ROAD_BOTTOM_WIDTH;
        const width = topW + (bottomW - topW) * p;
        const centerX = W * 0.5;
        const left = centerX - width * 0.5;
        const right = centerX + width * 0.5;
        return { left, right, width, centerX };
    }

    function laneX(lane, depth) {
        const { left, right } = getRoadEdges(depth);
        let pos;
        if (lane === -1) pos = 1/6;
        else if (lane === 0) pos = 3/6;
        else pos = 5/6;
        return left + (right - left) * pos;
    }

    function roadY(depth) {
        const horizon = H * HORIZON_Y;
        const bottom = H * 1.02;
        const p = Math.min(1, Math.max(0, depth));
        return horizon + (bottom - horizon) * (p * p);
    }

    // ========== ОТРИСОВКА ==========
    function drawBackground() {
        if (!bgImg.complete || !bgImg.naturalWidth) {
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, W, H * HORIZON_Y);
            return;
        }
        const bgAspect = bgImg.width / bgImg.height;
        const canvasAspect = W / (H * HORIZON_Y);
        let drawWidth, drawHeight;
        if (bgAspect > canvasAspect) {
            drawHeight = H * HORIZON_Y;
            drawWidth = drawHeight * bgAspect;
        } else {
            drawWidth = W;
            drawHeight = drawWidth / bgAspect;
        }
        const x = (W - drawWidth) / 2;
        const y = 0;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, H * HORIZON_Y);
        ctx.clip();
        ctx.drawImage(bgImg, x, y, drawWidth, drawHeight);
        ctx.restore();
    }

    function drawPlayer() {
        if (!playerImg.complete || !playerImg.naturalWidth) return;
        let x = laneX(playerLane, 0.22);
        if (playerLane === -1) x -= 18;
        else if (playerLane === 1) x += 18;

        const baseY = H * 0.88;
        const slide = slideTimer > 0;
        const bob = Math.sin(Date.now() * 0.015) * 2.5;  // лёгкое покачивание

        const playerHeight = 120;
        const playerWidth = playerHeight * (playerImg.width / playerImg.height);
        const drawW = slide ? playerWidth * 1.1 : playerWidth;
        const drawH = slide ? playerHeight * 0.8 : playerHeight;
        const drawX = x - drawW / 2;
        const drawY = baseY - drawH / 2 + bob;

        ctx.save();
        ctx.shadowBlur = 0;               // убрано голубое свечение
        ctx.drawImage(playerImg, drawX, drawY, drawW, drawH);
        ctx.restore();
    }

    function drawObstacle(o) {
        const p = 1 - o.z;
        if (p < 0 || p > 1.2) return;
        const x = laneX(o.lane, p);
        const y = roadY(p);
        const scale = 0.5 + p * 1.6;

        let w, h;
        if (o.type === 'car' || o.type === 'truck') {
            if (!enemyImg.complete || !enemyImg.naturalWidth) return;
            const baseH = 55 * 0.7;
            const baseW = baseH * (enemyImg.width / enemyImg.height);
            h = baseH * scale;
            w = baseW * scale;
        } else if (o.type === 'barrier') {
            if (!barrierImg.complete || !barrierImg.naturalWidth) return;
            const baseH = 45 * 0.7;
            const baseW = baseH * (barrierImg.width / barrierImg.height);
            h = baseH * scale;
            w = baseW * scale;
        }

        ctx.save();
        ctx.translate(x, y - h * 0.5);
        if (o.type === 'car' || o.type === 'truck') {
            ctx.drawImage(enemyImg, -w/2, -h/2, w, h);
        } else if (o.type === 'barrier') {
            ctx.drawImage(barrierImg, -w/2, -h/2, w, h);
        }
        ctx.restore();
    }

    function drawRoad() {
        const horizon = H * HORIZON_Y;
        const bottom = H * 1.02;
        const topW = W * ROAD_TOP_WIDTH;
        const botW = W * ROAD_BOTTOM_WIDTH;
        const cx = W * 0.5;

        // обочина – зелёная
        ctx.fillStyle = '#4a5a3a';
        ctx.fillRect(0, horizon, W, bottom - horizon);

        // асфальт
        const grad = ctx.createLinearGradient(0, horizon, 0, bottom);
        grad.addColorStop(0, '#3a3a3a');
        grad.addColorStop(1, '#5a5a5a');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx - botW * 0.5, bottom); ctx.lineTo(cx + botW * 0.5, bottom);
        ctx.lineTo(cx + topW * 0.5, horizon); ctx.lineTo(cx - topW * 0.5, horizon);
        ctx.fill();

        // разделительные полосы (двигаются вместе с дорогой)
        for (let divider = 1; divider <= 2; divider++) {
            const dashLen = 0.06;
            for (let d = 0; d < 1; d += dashLen) {
                const p = (d + roadScroll * 0.04) % 1;
                const p2 = (p + dashLen * 0.8) % 1;
                const y1 = horizon + (bottom - horizon) * p;
                const y2 = horizon + (bottom - horizon) * p2;
                const leftEdge = cx - (topW + (botW - topW) * p) * 0.5;
                const rightEdge = cx + (topW + (botW - topW) * p) * 0.5;
                const fraction = divider / 3;
                const x1 = leftEdge + (rightEdge - leftEdge) * fraction;
                const x2 = leftEdge + (rightEdge - leftEdge) * fraction;
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            }
        }

        // лёгкие штрихи текстуры
        ctx.globalAlpha = 0.05;
        for (let i = 0; i < 30; i++) {
            const p = ((i / 30) + roadScroll * 0.04) % 1;
            const y = horizon + (bottom - horizon) * p;
            const w = topW + (botW - topW) * p;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - w * 0.45, y, w * 0.9, 1);
        }
        ctx.globalAlpha = 1;
    }

    // ========== ЛОГИКА ==========
    function canSpawnOnLane(lane) {
        for (let o of obstacles) if (o.lane === lane && o.z > 0.55) return false;
        return true;
    }

    function spawnObstacle() {
        let available = [-1, 0, 1].filter(l => canSpawnOnLane(l));
        if (available.length === 0) return;
        const lane = available[Math.floor(Math.random() * available.length)];
        const r = Math.random();
        let type = 'car';
        if (r < 0.3) type = 'truck';
        else if (r < 0.55) type = 'barrier';
        obstacles.push({ lane, z: 1.12, type, passed: false });
    }

    function updateGame(dt) {
        if (!gameRunning) return;

        if (safeTimer > 0) {
            safeTimer -= dt;
            if (safeTimer <= 0) safeTimer = 0;
        }

        timeLeft -= dt;
        if (timeLeft <= 0) {
            timeLeft = 0;
            endGame(true);
            return;
        }
        document.getElementById('timer').innerText = timeLeft.toFixed(1);

        for (let i = 0; i < obstacles.length; i++) {
            obstacles[i].z -= dt * 1.1;
            if (obstacles[i].z < -0.3) {
                obstacles.splice(i, 1);
                i--;
            }
        }

        if (slideTimer > 0) slideTimer -= dt; else slideTimer = 0;
        playerLane = targetLane;

        if (safeTimer <= 0) {
            for (let o of obstacles) {
                if (o.lane === playerLane && o.z < 0.11 && o.z > 0.00) {
                    const canPass = (o.type === 'truck' && slideTimer > 0);
                    if (!canPass) {
                        gameRunning = false;
                        endGame(false);
                        return;
                    }
                }
            }
        }

        if (spawnCooldown > 0) {
            spawnCooldown -= dt;
        } else if (obstacles.length < 7 && safeTimer <= 0) {
            spawnCooldown = 0.9 + Math.random() * 0.6;
            spawnObstacle();
        }

        roadScroll += dt * 9;
    }

    function render() {
        ctx.clearRect(0, 0, W, H);
        drawBackground();
        drawRoad();
        const sorted = [...obstacles].sort((a,b) => b.z - a.z);
        for (let o of sorted) drawObstacle(o);
        drawPlayer();
    }

    async function endGame(survived) {
        if (!gameRunning || finishSent) return;
        gameRunning = false;
        finishSent = true;
        document.getElementById('resultScreen').style.display = 'flex';
        try {
            const res = await fetch(API + "/games/runner/finish", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    init_data: initDataFromUrl || tg?.initData || "",
                    session_token: sessionToken,
                    survived: survived
                })
            });
            const data = await res.json();
            const titleEl = document.getElementById('resultTitle');
            const textEl = document.getElementById('resultText');
            if (data.ok && data.win) {
                titleEl.innerText = t('win_title');
                textEl.innerText = `${t('win_text')} +${data.reward} DOGS`;
                document.getElementById('winBlock').style.display = 'block';
                document.getElementById('homeBtn').style.display = 'none';
                let wait = 5;
                document.getElementById('claimTimer').innerText = wait;
                const rewardTimer = setInterval(() => {
                    wait--;
                    document.getElementById('claimTimer').innerText = wait;
                    if (wait <= 0) {
                        clearInterval(rewardTimer);
                        document.getElementById('homeBtn').style.display = 'block';
                    }
                }, 1000);
            } else {
                titleEl.innerText = t('lost_title');
                textEl.innerText = t('lost_text');
            }
        } catch(e) { console.error(e); }
    }

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        gameRunning = true;
        timeLeft = surviveTimeGoal;
        playerLane = 0; targetLane = 0; slideTimer = 0;
        obstacles = [];
        spawnCooldown = 0.5;
        safeTimer = 0.8;
        document.getElementById('timer').innerText = timeLeft.toFixed(1);
    }

    async function goHome() {
        try { if (Math.random() < 1/3) await ExitAdController.show(); } catch (e) {}
        window.location.href = "../../";
    }

    // Управление
    function setLane(delta) {
        if (!gameRunning) return;
        let newLane = targetLane + delta;
        if (newLane < -1) newLane = -1;
        if (newLane > 1) newLane = 1;
        targetLane = newLane;
    }
    function doSlide() { if (gameRunning) slideTimer = 0.68; }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') { setLane(-1); e.preventDefault(); }
        else if (e.key === 'ArrowRight' || e.key === 'd') { setLane(1); e.preventDefault(); }
        else if (e.key === 'ArrowDown' || e.key === 's') { doSlide(); e.preventDefault(); }
    });

    let touchStartX = 0, touchStartY = 0, touchMoved = false;
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchMoved = false;
    });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); touchMoved = true; });
    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (!gameRunning) { startGame(); return; }
        if (!touchMoved) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) setLane(dx > 0 ? 1 : -1);
        else if (Math.abs(dy) > 20 && dy > 0) doSlide();
    });

    let mouseStartX, mouseStartY, mouseMoved = false;
    canvas.addEventListener('mousedown', (e) => { e.preventDefault(); mouseStartX = e.clientX; mouseStartY = e.clientY; mouseMoved = false; });
    canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) mouseMoved = true; });
    canvas.addEventListener('mouseup', (e) => {
        if (!gameRunning) { startGame(); return; }
        if (!mouseMoved) return;
        const dx = e.clientX - mouseStartX;
        const dy = e.clientY - mouseStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 15) setLane(dx > 0 ? 1 : -1);
        else if (Math.abs(dy) > 15 && dy > 0) doSlide();
    });

    let lastTime = performance.now() / 1000;
    function gameLoop() {
        const now = performance.now() / 1000;
        let dt = Math.min(0.033, now - lastTime);
        if (dt < 0) dt = 0.016;
        lastTime = now;
        updateGame(dt);
        render();
        requestAnimationFrame(gameLoop);
    }

    setTimeout(() => {
        if (imagesReady) {
            gameLoop();
        } else {
            const checkReady = setInterval(() => {
                if (imagesReady) { clearInterval(checkReady); gameLoop(); }
            }, 100);
        }
    }, 100);
</script>
</body>
</html>
