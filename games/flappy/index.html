<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no
    "
/>

<title>DOGS FLAPPY</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#0d0d0e;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    color:white;

    touch-action:none;
}

#gameWrap{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;
}

/* ---------------- CANVAS ---------------- */

canvas{

    width:100%;
    height:100%;

    display:block;
}

/* ---------------- TOP UI ---------------- */

#topUI{

    position:absolute;

    top:14px;
    left:14px;
    right:14px;

    z-index:20;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.uiCard{

    background:rgba(18,18,18,.92);

    border:1px solid #2a2a2a;

    border-radius:18px;

    padding:10px 14px;

    backdrop-filter:blur(8px);
}

#timer{

    font-size:22px;

    font-weight:900;
}

#difficulty{

    font-size:13px;

    color:#55ef8b;

    font-weight:800;
}

/* ---------------- START SCREEN ---------------- */

#startScreen{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            #0d0d0e,
            #17181c
        );

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:50;
}

#logo{

    font-size:48px;

    font-weight:900;

    margin-bottom:14px;
}

#subtitle{

    max-width:320px;

    text-align:center;

    color:#8e8e93;

    line-height:1.5;

    margin-bottom:30px;
}

.playBtn{

    border:none;

    background:#55ef8b;

    color:black;

    font-size:18px;

    font-weight:900;

    border-radius:18px;

    padding:16px 34px;

    cursor:pointer;
}

/* ---------------- RESULT ---------------- */

#resultScreen{

    position:absolute;

    inset:0;

    background:rgba(0,0,0,.84);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:60;
}

.resultCard{

    width:340px;

    background:#18181a;

    border:1px solid #2d2d2f;

    border-radius:24px;

    padding:22px;
}

.resultTitle{

    text-align:center;

    font-size:30px;

    font-weight:900;

    margin-bottom:8px;
}

.resultText{

    text-align:center;

    color:#8e8e93;

    line-height:1.5;

    margin-bottom:18px;
}

/* ---------------- ADS ---------------- */

.adBanner{

    width:100%;

    height:58px;

    border-radius:16px;

    background:#101010;

    border:1px dashed #333;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#666;

    margin-bottom:12px;
}

/* ---------------- WAIT ---------------- */

.waitBox{

    background:#101010;

    border:1px solid #2c2c2c;

    border-radius:18px;

    padding:16px;

    text-align:center;

    margin-bottom:16px;
}

#claimTimer{

    font-size:32px;

    font-weight:900;

    color:#55ef8b;

    margin-top:8px;
}

/* ---------------- BUTTON ---------------- */

.resultBtn{

    width:100%;

    border:none;

    border-radius:16px;

    padding:15px;

    background:#55ef8b;

    color:black;

    font-size:16px;

    font-weight:900;

    cursor:pointer;
}

/* ---------------- LOADING ---------------- */

#loading{

    position:absolute;

    inset:0;

    background:#0d0d0e;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:100;

    font-size:20px;

    font-weight:800;
}

</style>
</head>

<body>

<div id="gameWrap">

    <!-- LOADING -->

    <div id="loading">
        Loading...
    </div>

    <!-- TOP UI -->

    <div id="topUI">

        <div class="uiCard">
            <div id="timer">
                20
            </div>
        </div>

        <div class="uiCard">
            <div id="difficulty">
                EASY
            </div>
        </div>

    </div>

    <!-- START -->

    <div id="startScreen">

        <div id="logo">
            DOGS FLAPPY
        </div>

        <div id="subtitle">
            Survive until timer ends
            to receive DOGS reward.
        </div>

        <button
            class="playBtn"
            onclick="startGame()"
        >
            PLAY
        </button>

    </div>

    <!-- RESULT -->

    <div id="resultScreen">

        <div class="resultCard">

            <div
                class="resultTitle"
                id="resultTitle"
            >
                YOU LOST
            </div>

            <div
                class="resultText"
                id="resultText"
            >
                Try again tomorrow.
            </div>

            <!-- ADS -->

            <div class="adBanner">
                Banner Ad
            </div>

            <div class="adBanner">
                Banner Ad
            </div>

            <!-- WAIT -->

            <div
                id="winBlock"
                style="display:none;"
            >

                <div class="waitBox">

                    Reward is being credited.
                    Please wait...

                    <div id="claimTimer">
                        5
                    </div>

                </div>

            </div>

            <!-- BUTTON -->

            <button
                class="resultBtn"
                onclick="goHome()"
                id="homeBtn"
            >
                RETURN HOME
            </button>

        </div>

    </div>

    <!-- CANVAS -->

    <canvas id="game"></canvas>

</div>

<script>

/* ---------------- IMAGES ---------------- */

const birdImg = new Image();
birdImg.src = "bird.png";

const pipeImg = new Image();
pipeImg.src = "pipe.png";

const bgImg = new Image();
bgImg.src = "bg.png";

/* ---------------- API + TG ---------------- */

const tg = window.Telegram?.WebApp;
tg?.expand?.();

const API = "https://dogs-7ntt.onrender.com";

const sessionToken =
    new URLSearchParams(window.location.search)
        .get("session_token");

let finishSent = false; // защита от двойной отправки

if(!sessionToken){
    document.querySelector(".playBtn").disabled = true;
    document.querySelector(".playBtn").innerText = "INVALID SESSION";
}
    
/* ---------------- PRELOAD ---------------- */

let loadedImages = 0;

function imageLoaded(){

    loadedImages++;

    if(loadedImages >= 3){

        document.getElementById(
            "loading"
        ).style.display = "none";
    }
}

birdImg.onload = imageLoaded;
pipeImg.onload = imageLoaded;
bgImg.onload = imageLoaded;

/* ---------------- DIFFICULTY ---------------- */

/*

0-2 wins => EASY
3-5 => MEDIUM
6+ => HARD

later from backend

*/

const difficultyLevel = 0;

let difficulty = {

    pipeGap:230,
    pipeSpeed:2.8,
    gravity:0.38,

    survive:40
};

if(difficultyLevel >= 3){

    difficulty = {

        pipeGap:205,
        pipeSpeed:3.5,
        gravity:0.4,

        survive:45
    };

    document.getElementById(
        "difficulty"
    ).innerText = "MEDIUM";
}

if(difficultyLevel >= 6){

    difficulty = {

        pipeGap:185,
        pipeSpeed:4.2,
        gravity:0.43,

        survive:50
    };

    document.getElementById(
        "difficulty"
    ).innerText = "HARD";
}

/* ---------------- CANVAS ---------------- */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

function resizeCanvas(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

/* ---------------- GAME ---------------- */

let gameStarted = false;
let gameEnded = false;

let surviveTime =
    difficulty.survive;

let timerInterval;

const bird = {

    x:90,
    y:300,

    width:92,
    height:38,

    velocity:0,

    jump:-7
};

let pipes = [];

/* ---------------- PIPE ---------------- */

function createPipe(){

    const minTop = 90;

    const maxTop =

        canvas.height -
        difficulty.pipeGap -
        160;

    const topHeight =

        Math.random() *

        (maxTop - minTop)

        + minTop;

    pipes.push({

        x:canvas.width,

        width:110,

        top:topHeight,

        bottom:
            canvas.height -
            topHeight -
            difficulty.pipeGap
    });
}

/* ---------------- START ---------------- */

function startGame(){

    document.getElementById(
        "startScreen"
    ).style.display = "none";

    gameStarted = true;

    startTimer();
}

/* ---------------- TIMER ---------------- */

function startTimer(){

    surviveTime =
        difficulty.survive;

    document.getElementById(
        "timer"
    ).innerText =
        surviveTime;

    clearInterval(timerInterval);

    timerInterval =
        setInterval(() => {

            surviveTime--;

            document.getElementById(
                "timer"
            ).innerText =
                surviveTime;

            if(surviveTime <= 0){

                clearInterval(
                    timerInterval
                );

                winGame();
            }

        },1000);
}

/* ---------------- BG ---------------- */

function drawBackground(){

    const bgRatio =
        bgImg.width / bgImg.height;

    const canvasRatio =
        canvas.width / canvas.height;

    let drawWidth;
    let drawHeight;

    if(bgRatio > canvasRatio){

        drawHeight =
            canvas.height;

        drawWidth =
            canvas.height *
            bgRatio;

    }else{

        drawWidth =
            canvas.width;

        drawHeight =
            canvas.width /
            bgRatio;
    }

    ctx.drawImage(

        bgImg,

        (canvas.width - drawWidth) / 2,

        (canvas.height - drawHeight) / 2,

        drawWidth,
        drawHeight
    );
}

/* ---------------- BIRD ---------------- */

function drawBird(){

    const angle =

        Math.min(
            bird.velocity * 0.05,
            0.5
        );

    ctx.save();

    ctx.translate(

        bird.x + bird.width / 2,

        bird.y + bird.height / 2
    );

    ctx.rotate(angle);

    ctx.drawImage(

        birdImg,

        -bird.width / 2,

        -bird.height / 2,

        bird.width,
        bird.height
    );

    ctx.restore();
}

/* ---------------- PIPES ---------------- */

function drawPipes(){

    pipes.forEach(pipe => {

        // TOP

        ctx.save();

        ctx.translate(

            pipe.x + pipe.width / 2,

            pipe.top / 2
        );

        ctx.scale(1,-1);

        ctx.drawImage(

            pipeImg,

            -pipe.width / 2,

            -pipe.top / 2,

            pipe.width,
            pipe.top
        );

        ctx.restore();

        // BOTTOM

        ctx.drawImage(

            pipeImg,

            pipe.x,

            canvas.height -
            pipe.bottom,

            pipe.width,
            pipe.bottom
        );
    });
}

/* ---------------- LOSE ---------------- */

async function loseGame(){

    if(gameEnded) return;

    gameEnded = true;
    clearInterval(timerInterval);

    document.getElementById("resultScreen").style.display = "flex";
    document.getElementById("resultTitle").innerText = "YOU LOST";
    document.getElementById("resultText").innerText = "You failed to survive.";

    const res = await sendFinish(false);

    // Мягкая обработка ошибок для UX
    if(!res.ok){
        if(res.error === "already_completed"){
            // уже отправляли — игнор
        }else if(res.error === "session_expired"){
            document.getElementById("resultText").innerText =
                "Session expired. Start a new run from GameHub.";
        }else if(res.error === "invalid_session"){
            document.getElementById("resultText").innerText =
                "Invalid game session. Start game from GameHub.";
        }else{
            // network/server error: просто лог, экран поражения уже показан
            console.log("LOSE FINISH ERROR:", res.error);
        }
    }
}

/* ---------------- WIN ---------------- */

async function winGame(){

    if(gameEnded) return;

    gameEnded = true;
    clearInterval(timerInterval);

    document.getElementById("resultScreen").style.display = "flex";
    document.getElementById("resultTitle").innerText = "YOU WON";
    document.getElementById("resultText").innerText =
        "DOGS reward will be credited shortly.";

    document.getElementById("winBlock").style.display = "block";
    document.getElementById("homeBtn").style.display = "none";

    // сначала отправляем результат на backend
    const res = await sendFinish(true);

    if(!res.ok){
        // если не удалось зачесть — покажем понятный текст
        document.getElementById("winBlock").style.display = "none";
        document.getElementById("homeBtn").style.display = "block";

        if(res.error === "already_completed"){
            document.getElementById("resultText").innerText =
                "Run already completed.";
        }else if(res.error === "session_expired"){
            document.getElementById("resultText").innerText =
                "Session expired. Reward not credited.";
        }else if(res.error === "invalid_session"){
            document.getElementById("resultText").innerText =
                "Invalid session. Start from GameHub.";
        }else{
            document.getElementById("resultText").innerText =
                "Server error. Please try again.";
        }

        return;
    }

    // успех: можно показать награду из backend
    if(res.win && typeof res.reward !== "undefined"){
        document.getElementById("resultText").innerText =
            `You survived! Reward: +${res.reward} DOGS`;
    }

    let wait = 5;
    document.getElementById("claimTimer").innerText = wait;

    const rewardTimer = setInterval(() => {

        wait--;
        document.getElementById("claimTimer").innerText = wait;

        if(wait <= 0){
            clearInterval(rewardTimer);
            document.getElementById("homeBtn").style.display = "block";
        }

    }, 1000);
}

/* ---------------- HOME ---------------- */

function goHome(){
    window.location.href = "../../";
}

/* ---------------- INPUT ---------------- */

function flap(){

    if(
        !gameStarted ||
        gameEnded
    ) return;

    bird.velocity =
        bird.jump;
}

window.addEventListener(
    "click",
    flap
);

window.addEventListener(
    "touchstart",
    flap
);

/* ---------------- FINISH REQUEST ---------------- */

async function sendFinish(survived){

    if(finishSent) return { ok:false, error:"already_sent_local" };
    finishSent = true;

    if(!sessionToken){
        console.log("No session_token in URL");
        return { ok:false, error:"missing_session_token" };
    }

    try{

        const r = await fetch(API + "/games/flappy/finish", {
            method: "POST",
            headers: {
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                init_data: tg?.initData || "",
                session_token: sessionToken,
                survived: !!survived
            })
        });

        const d = await r.json();
        return d;

    }catch(e){
        console.log("FINISH REQUEST ERROR:", e);
        return { ok:false, error:"network_error" };
    }
}

/* ---------------- LOOP ---------------- */

function update(){

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height
    );

    drawBackground();

    if(gameStarted && !gameEnded){

        bird.velocity +=
            difficulty.gravity;

        bird.y +=
            bird.velocity;

        // pipes

        if(

            pipes.length === 0 ||

            pipes[
                pipes.length - 1
            ].x < canvas.width - 340
        ){
            createPipe();
        }

        // collision hitbox

        const hitbox = {

            x: bird.x + 12,
            y: bird.y + 6,

            width:
                bird.width - 24,

            height:
                bird.height - 12
        };

        pipes.forEach(pipe => {

            pipe.x -=
                difficulty.pipeSpeed;

            if(

                hitbox.x + hitbox.width >
                pipe.x &&

                hitbox.x <
                pipe.x + pipe.width &&

                (

                    hitbox.y <
                    pipe.top ||

                    hitbox.y +
                    hitbox.height >

                    canvas.height -
                    pipe.bottom
                )
            ){
                loseGame();
            }

        });

        // cleanup

        pipes = pipes.filter(
            p => p.x + p.width > 0
        );

        // floor

        if(

            bird.y +
            bird.height >=
            canvas.height
        ){
            loseGame();
        }

        // ceiling

        if(bird.y <= 0){

            bird.y = 0;
        }
    }

    drawPipes();

    drawBird();

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
