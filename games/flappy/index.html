<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FLAPPY DOGS</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(ellipse at 50% 0%, #1a1b24 0%, #0f1015 55%, #0a0b0f 100%);
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            color: #f5f5f7;
            touch-action: none;
            -webkit-font-smoothing: antialiased;
        }
        #gameWrap {
            position: relative; width: 100vw; height: 100vh; overflow: hidden;
        }
        canvas {
            width: 100%; height: 100%; display: block;
        }
        .glass-card {
            background: rgba(28, 28, 32, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 18px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        }
        #topUI {
            position: absolute; top: 14px; left: 14px; right: 14px;
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; z-index: 20;
        }
        .uiCard {
            background: rgba(28, 28, 32, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 14px 20px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            display: flex; align-items: center; justify-content: center;
            min-width: 80px;
        }
        #timer { font-size: 22px; font-weight: 900; color: #ffffff; }
        #difficulty { font-size: 13px; color: #c0c0c0; font-weight: 800; letter-spacing: 0.5px; }
        #startScreen {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; padding: 20px; gap: 16px;
        }
        .start-card {
            background: rgba(28,28,32,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 32px 24px;
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
            text-align: center;
            width: 300px;
            max-width: 90vw;
        }
        #logo { font-size: 44px; font-weight: 900; margin-bottom: 10px; letter-spacing: -1px; color: #ffffff; }
        #subtitle { max-width: 280px; text-align: center; color: #8e8e93; line-height: 1.5; margin-bottom: 28px; font-size: 15px; }
        .playBtn {
            border: none; background: #c0c0c0; color: #1a1a1d;
            font-size: 18px; font-weight: 800; border-radius: 18px;
            padding: 16px 34px; cursor: pointer; width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 18px rgba(192,192,192,0.25);
            letter-spacing: 0.5px;
        }
        .playBtn:active { transform: scale(0.96); opacity: 0.85; box-shadow: 0 1px 6px rgba(192,192,192,0.1); }
        #resultScreen {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            display: none; justify-content: center; align-items: center;
            z-index: 60; padding: 20px;
        }
        .resultCard {
            background: rgba(28,28,32,0.75);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 24px;
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
            width: 340px; max-width: 90vw; text-align: center;
        }
        .resultTitle { font-size: 30px; font-weight: 900; margin-bottom: 8px; color: #ffffff; }
        .resultText { color: #8e8e93; line-height: 1.5; margin-bottom: 18px; font-size: 15px; }
        .adBanner {
            width: 100%; margin-bottom: 12px;
            border-radius: 16px;
            background: rgba(20,20,24,0.5);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .waitBox {
            background: rgba(20,20,24,0.55);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 18px; text-align: center; margin-bottom: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #f5f5f7;
        }
        #claimTimer { font-size: 32px; font-weight: 900; color: #c0c0c0; margin-top: 8px; }
        .resultBtn {
            width: 100%; border: none; border-radius: 18px; padding: 16px;
            background: #c0c0c0; color: #1a1a1d; font-size: 16px; font-weight: 800;
            cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 18px rgba(192,192,192,0.25); letter-spacing: 0.5px;
        }
        .resultBtn:active { transform: scale(0.96); opacity: 0.85; box-shadow: 0 1px 6px rgba(192,192,192,0.1); }
        #loading {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; font-size: 22px; font-weight: 800; color: #c0c0c0; letter-spacing: 2px;
        }
        .start-ad { width: 300px; max-width: 90vw; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div id="gameWrap">
        <div id="loading"></div>
        <div id="topUI">
            <div class="uiCard"><div id="timer">40</div></div>
            <div class="uiCard"><div id="difficulty"></div></div>
        </div>

        <div id="startScreen">
            <div class="adBanner start-ad">
                <div style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                    <iframe data-aa='2438445' src='//acceptable.a-ads.com/2438445/?size=Adaptive' style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'></iframe>
                </div>
            </div>
            <div class="start-card">
                <div id="logo">Flappy DOGS</div>
                <div id="subtitle"></div>
                <button class="playBtn" onclick="startGame()"></button>
            </div>
        </div>

        <div id="resultScreen">
            <div class="resultCard">
                <div class="resultTitle" id="resultTitle"></div>
                <div class="resultText" id="resultText"></div>
                <div class="adBanner">
                    <div style="width:100%;margin:auto;position:relative;z-index:99998;">
                        <iframe data-aa='2438445' src='//acceptable.a-ads.com/2438445/?size=Adaptive' style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'></iframe>
                    </div>
                </div>
                <div class="adBanner">
                    <div style="width:100%;margin:auto;position:relative;z-index:99998;">
                        <iframe data-aa='2438445' src='//acceptable.a-ads.com/2438445/?size=Adaptive' style='border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto'></iframe>
                    </div>
                </div>
                <div id="winBlock" style="display:none;">
                    <div class="waitBox" id="waitBoxText"></div>
                    <div id="claimTimer">5</div>
                </div>
                <button class="resultBtn" onclick="goHome()" id="homeBtn"></button>
            </div>
        </div>

        <canvas id="game"></canvas>
    </div>

    <script>
        // ========== ЛОКАЛИЗАЦИЯ ==========
        const currentLang = localStorage.getItem('lang') || 'en';
        const LOCALE = {
            ru: {
                loading: "Загрузка...",
                play: "ИГРАТЬ",
                difficulty: {1:"ЛЕГКО",2:"СРЕДНЕ",3:"СЛОЖНО"},
                survive: "Продержитесь",
                reward: "Награда",
                sec: "с",
                lost_title: "ВЫ ПРОИГРАЛИ (>_<)",
                lost_text: "Вы не смогли выжить.",
                win_title: "ВЫ ВЫИГРАЛИ 🎉",
                win_text: "Вы выжили! Награда:",
                session_expired: "Сессия истекла.",
                invalid_session: "Неверная игровая сессия.",
                already_completed: "Забег уже завершён.",
                wait_text: "Награда начисляется.<br>Пожалуйста, подождите...",
                home_btn: "ВЕРНУТЬСЯ ДОМОЙ",
                open_from_hub: "ОТКРОЙТЕ ИЗ GAMEHUB"
            },
            en: {
                loading: "Loading...",
                play: "PLAY",
                difficulty: {1:"EASY",2:"MEDIUM",3:"HARD"},
                survive: "Survive",
                reward: "Reward",
                sec: "s",
                lost_title: "YOU LOST (>_<)",
                lost_text: "You failed to survive.",
                win_title: "YOU WON 🎉",
                win_text: "You survived! Reward:",
                session_expired: "Session expired.",
                invalid_session: "Invalid game session.",
                already_completed: "Run already completed.",
                wait_text: "Reward is being credited.<br>Please wait...",
                home_btn: "RETURN HOME",
                open_from_hub: "OPEN FROM GAMEHUB"
            }
        };
        function t(key) { return LOCALE[currentLang]?.[key] ?? key; }
        function td(key) { return LOCALE[currentLang]?.difficulty?.[key] ?? key; }

        // Установка начальных текстов
        document.getElementById('loading').innerText = t('loading');
        document.querySelector('.playBtn').innerText = t('play');
        document.getElementById('homeBtn').innerText = t('home_btn');
        document.getElementById('waitBoxText').innerHTML = t('wait_text');

        const tg = window.Telegram?.WebApp;
        tg?.expand?.();

        const ExitAdController = window.Adsgram.init({ blockId: "int-31473" });

        const API = "https://dogs-7ntt.onrender.com";
        const sessionToken = new URLSearchParams(window.location.search).get("session_token");
        const initDataFromUrl = new URLSearchParams(window.location.search).get("init_data");
        let finishSent = false;

        // Игровые переменные, которые получим от сервера
        let gameDifficulty = 1;
        let surviveTimeGoal = 40;
        let expectedReward = 5;
        const rewardMap = {1:5, 2:7, 3:10};

        // Параметры труб будут назначены после загрузки
        let difficulty = { pipeGap: 230, pipeSpeed: 2.8, gravity: 0.38 };

        // ========== ИНИЦИАЛИЗАЦИЯ С СЕРВЕРА ==========
        async function init() {
            if (!sessionToken) {
                document.querySelector(".playBtn").disabled = true;
                document.querySelector(".playBtn").innerText = t('open_from_hub');
                return;
            }
            try {
                const res = await fetch(API + "/games/flappy/start", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ init_data: initDataFromUrl || tg?.initData || "" })
                });
                const data = await res.json();
                if (!data.ok) {
                    document.querySelector(".playBtn").disabled = true;
                    document.querySelector(".playBtn").innerText = data.error || "Error";
                    return;
                }
                gameDifficulty = data.difficulty;
                localStorage.setItem('flappy_difficulty', data.difficulty);
                surviveTimeGoal = data.survive_time;
                expectedReward = rewardMap[gameDifficulty];
                document.getElementById('difficulty').innerText = td(gameDifficulty);
                document.getElementById('subtitle').innerHTML = `
                    ${t('survive')}: <b>${surviveTimeGoal}${t('sec')}</b><br>
                    ${t('reward')}: <b>${expectedReward} DOGS</b>
                `;
                // Установка параметров сложности для игры
                const diffSettings = {
                    1: { pipeGap: 230, pipeSpeed: 2.8, gravity: 0.38 },
                    2: { pipeGap: 205, pipeSpeed: 3.5, gravity: 0.4 },
                    3: { pipeGap: 185, pipeSpeed: 4.2, gravity: 0.43 }
                };
                difficulty = diffSettings[gameDifficulty];
                // Скрываем экран загрузки после успешной инициализации
                hideLoading();
            } catch (e) {
                console.error("Init error:", e);
                hideLoading(); // всё равно скрываем, чтобы не висло
            }
        }

        // Запускаем инициализацию сразу
        init();

        // Изображения и их предзагрузка
        const birdImg = new Image();
        const pipeImg = new Image();
        const bgImg = new Image();

        let loadedImages = 0;
        const TOTAL_IMAGES = 3;
        let loadingHidden = false;

        function hideLoading() {
            if (loadingHidden) return;
            loadingHidden = true;
            document.getElementById("loading").style.display = "none";
        }

        function imageLoaded() {
            loadedImages++;
            if (loadedImages >= TOTAL_IMAGES) {
                // изображения загружены, но игру пока не запускаем, экран загрузки скроется после инициализации с сервера
            }
        }

        birdImg.onload = imageLoaded;
        pipeImg.onload = imageLoaded;
        bgImg.onload = imageLoaded;
        birdImg.onerror = imageLoaded;
        pipeImg.onerror = imageLoaded;
        bgImg.onerror = imageLoaded;

        birdImg.src = "bird.png";
        pipeImg.src = "pipe.png";
        bgImg.src = "bg.png";

        // Таймаут на случай, если изображения или сервер долго грузятся
        setTimeout(hideLoading, 3000);

        // Canvas
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        let gameStarted = false;
        let gameEnded = false;
        let surviveTime = surviveTimeGoal;
        let timerInterval;

        const bird = { x: 90, y: 300, width: 92, height: 38, velocity: 0, jump: -7 };
        let pipes = [];

        function createPipe() {
            const minTop = 90;
            const maxTop = canvas.height - difficulty.pipeGap - 160;
            const topHeight = Math.random() * (maxTop - minTop) + minTop;
            pipes.push({
                x: canvas.width,
                width: 110,
                top: topHeight,
                bottom: canvas.height - topHeight - difficulty.pipeGap
            });
        }

        function startGame() {
            document.getElementById("startScreen").style.display = "none";
            gameStarted = true;
            startTimer();
        }

        function startTimer() {
            surviveTime = surviveTimeGoal;
            document.getElementById("timer").innerText = surviveTime;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                surviveTime--;
                document.getElementById("timer").innerText = surviveTime;
                if (surviveTime <= 0) {
                    clearInterval(timerInterval);
                    winGame();
                }
            }, 1000);
        }

        function drawBackground() {
            if (!bgImg.complete || !bgImg.naturalWidth) {
                ctx.fillStyle = "#0d0d0e";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            const bgRatio = bgImg.width / bgImg.height;
            const canvasRatio = canvas.width / canvas.height;
            let drawWidth, drawHeight;
            if (bgRatio > canvasRatio) {
                drawHeight = canvas.height;
                drawWidth = canvas.height * bgRatio;
            } else {
                drawWidth = canvas.width;
                drawHeight = canvas.width / bgRatio;
            }
            ctx.drawImage(bgImg, (canvas.width - drawWidth) / 2, (canvas.height - drawHeight) / 2, drawWidth, drawHeight);
        }

        function drawBird() {
            if (!birdImg.complete || !birdImg.naturalWidth) {
                ctx.fillStyle = "#c0c0c0";
                ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
                return;
            }
            const angle = Math.min(bird.velocity * 0.05, 0.5);
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(angle);
            ctx.drawImage(birdImg, -bird.width / 2, -bird.height / 2, bird.width, bird.height);
            ctx.restore();
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                if (!pipeImg.complete || !pipeImg.naturalWidth) {
                    ctx.fillStyle = "#2f80ff";
                    ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                    ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
                    return;
                }
                ctx.save();
                ctx.translate(pipe.x + pipe.width / 2, pipe.top / 2);
                ctx.scale(1, -1);
                ctx.drawImage(pipeImg, -pipe.width / 2, -pipe.top / 2, pipe.width, pipe.top);
                ctx.restore();
                ctx.drawImage(pipeImg, pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
            });
        }

        async function sendFinish(survived) {
            if (finishSent) return { ok: false, error: "already_sent_local" };
            const initData = initDataFromUrl || tg?.initData || "";
            if (!sessionToken) return { ok: false, error: "missing_session_token" };
            finishSent = true;
            try {
                const r = await fetch(API + "/games/flappy/finish", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ init_data: initData, session_token: sessionToken, survived: !!survived })
                });
                let d = null;
                try { d = await r.json(); } catch (parseErr) { finishSent = false; return { ok: false, error: "bad_json_response" }; }
                if (!d?.ok) finishSent = false;
                return d;
            } catch (e) { finishSent = false; return { ok: false, error: "network_error" }; }
        }

        async function loseGame() {
            if (gameEnded) return;
            gameEnded = true;
            clearInterval(timerInterval);
            document.getElementById("resultScreen").style.display = "flex";
            document.getElementById("resultTitle").innerText = t('lost_title');
            document.getElementById("resultText").innerText = t('lost_text');
            const res = await sendFinish(false);
            if (!res.ok) {
                if (res.error === "session_expired") document.getElementById("resultText").innerText = t('session_expired');
                else if (res.error === "invalid_session") document.getElementById("resultText").innerText = t('invalid_session');
            }
        }

        async function winGame() {
            if (gameEnded) return;
            gameEnded = true;
            clearInterval(timerInterval);
            document.getElementById("resultScreen").style.display = "flex";
            document.getElementById("resultTitle").innerText = t('win_title');
            document.getElementById("resultText").innerText = "DOGS reward will be credited shortly.";
            document.getElementById("winBlock").style.display = "block";
            document.getElementById("homeBtn").style.display = "none";
            const res = await sendFinish(true);
            if (!res.ok) {
                document.getElementById("winBlock").style.display = "none";
                document.getElementById("homeBtn").style.display = "block";
                if (res.error === "already_completed") document.getElementById("resultText").innerText = t('already_completed');
                else if (res.error === "session_expired") document.getElementById("resultText").innerText = t('session_expired');
                else if (res.error === "invalid_session") document.getElementById("resultText").innerText = t('invalid_session');
                return;
            }
            if (res.win && typeof res.reward !== "undefined") {
                document.getElementById("resultText").innerText = `${t('win_text')} +${res.reward} DOGS`;
            }
            let wait = 5;
            document.getElementById("claimTimer").innerText = wait;
            const rewardTimer = setInterval(() => {
                wait--;
                document.getElementById("claimTimer").innerText = wait;
                if (wait <= 0) {
                    clearInterval(rewardTimer);
                    document.getElementById("homeBtn").style.display = "block";
                }
            }, 1000);
        }

        async function goHome() {
            // Показ рекламы с вероятностью 1/3
            try {
                if (Math.random() < 1/3) {
                    await ExitAdController.show();
                }
            } catch (e) {
                // ошибка или отмена – ничего не делаем
            }
            window.location.href = "../../";
        }

        function flap() {
            if (!gameStarted || gameEnded) return;
            bird.velocity = bird.jump;
        }
        window.addEventListener("click", flap);
        window.addEventListener("touchstart", flap);

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            if (gameStarted && !gameEnded) {
                bird.velocity += difficulty.gravity;
                bird.y += bird.velocity;
                if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 340) createPipe();
                const hitbox = { x: bird.x + 12, y: bird.y + 6, width: bird.width - 24, height: bird.height - 12 };
                pipes.forEach(pipe => {
                    pipe.x -= difficulty.pipeSpeed;
                    if (hitbox.x + hitbox.width > pipe.x && hitbox.x < pipe.x + pipe.width &&
                        (hitbox.y < pipe.top || hitbox.y + hitbox.height > canvas.height - pipe.bottom)) {
                        loseGame();
                    }
                });
                pipes = pipes.filter(p => p.x + p.width > 0);
                if (bird.y + bird.height >= canvas.height) loseGame();
                if (bird.y <= 0) bird.y = 0;
            }
            drawPipes();
            drawBird();
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
