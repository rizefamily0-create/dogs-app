<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:system-ui;
}

.container{
    padding:16px;
}

h2{
    margin:0 0 10px 0;
}

.card{
    background:#111;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    font-weight:700;
    margin-top:5px;
    cursor:pointer;
}

.approve{
    background:#00c853;
    color:#000;
}

.reject{
    background:#ff1744;
    color:#fff;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

th, td{
    padding:8px;
    border-bottom:1px solid #222;
    text-align:left;
}

.status{
    font-weight:700;
}

.pending{ color:#ffb300; }
.paid{ color:#00e676; }
.rejected{ color:#ff5252; }

.small{
    opacity:0.7;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h2>🛠 Admin Panel</h2>

<div class="card">
    <div id="status">Loading...</div>
</div>

<!-- DASHBOARD -->
<div class="card">
    <h3>📊 Dashboard</h3>
    <div id="dashboard">Loading...</div>
    <button onclick="loadDashboard()">Refresh dashboard</button>
</div>

<!-- USERS -->
<div class="card">
    <h3>👤 Users</h3>

    <button onclick="loadUsers()">Refresh users</button>

    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Balance</th>
                <th>Last Claim</th>
            </tr>
        </thead>

        <tbody id="users"></tbody>
    </table>
</div>

<!-- WITHDRAW -->
<div class="card">

    <h3>💸 Withdraw requests</h3>

    <button onclick="loadWithdraws()">Refresh withdraws</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Amount</th>
                <th>Wallet</th>
                <th>Memo</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="withdraws"></tbody>
    </table>

</div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const API = "https://dogs-7ntt.onrender.com";
const initData = tg.initData;


// ---------------- DASHBOARD ----------------
async function loadDashboard(){

    try{

        const r = await fetch(API + "/admin/dashboard", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ init_data: initData })
        });

        const d = await r.json();

        if(!d.ok){
            document.getElementById("status").innerText = "❌ Not admin";
            return;
        }

        document.getElementById("dashboard").innerHTML = `
            👤 Users: <b>${d.users}</b><br>
            💰 Total balance: <b>${d.balance}</b><br>
            ⏳ Pending withdraws: <b>${d.pending}</b><br>
            ✅ Paid today: <b>${d.paid_today}</b>
        `;

    }catch(e){
        console.log(e);
    }
}


// ---------------- USERS ----------------
async function loadUsers(){

    try{

        const r = await fetch(API + "/admin/users", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ init_data: initData })
        });

        const d = await r.json();

        if(!d.ok){
            document.getElementById("status").innerText = "❌ Not admin";
            return;
        }

        const tbody = document.getElementById("users");
        tbody.innerHTML = "";

        d.users.forEach(u => {

            const user_id = u[0] ?? "-";
            const balance = u[1] ?? 0;
            const last = u[2] ?? "-";

            tbody.innerHTML += `
                <tr>
                    <td>${user_id}</td>
                    <td>${balance}</td>
                    <td>${last}</td>
                </tr>
            `;
        });

        document.getElementById("status").innerText =
            "✅ Users loaded: " + d.users.length;

    }catch(e){
        console.log(e);
    }
}


// ---------------- WITHDRAWS ----------------
async function loadWithdraws(){

    try{

        const r = await fetch(API + "/admin/withdraw/list", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ init_data: initData })
        });

        const d = await r.json();

        if(!d.ok){
            document.getElementById("status").innerText = "❌ Access denied";
            return;
        }

        const tbody = document.getElementById("withdraws");
        tbody.innerHTML = "";

        d.withdraws.forEach(w => {

            const statusClass =
                w.status === "paid" ? "paid" :
                w.status === "rejected" ? "rejected" : "pending";

            tbody.innerHTML += `
                <tr>
                    <td>${w.id}</td>
                    <td>${w.user_id}</td>
                    <td>${w.amount}</td>
                    <td>${w.wallet}</td>
                    <td>${w.memo || ""}</td>
                    <td class="status ${statusClass}">
                        ${w.status}
                    </td>
                    <td>
                        <button class="approve" onclick="approve(${w.id})">✔</button>
                        <button class="reject" onclick="rejectWithdraw(${w.id})">✖</button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("status").innerText =
            "💸 Withdraws loaded: " + d.withdraws.length;

    }catch(e){
        console.log(e);
    }
}


// ---------------- APPROVE ----------------
async function approve(id){

    await fetch(API + "/admin/withdraw/approve", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            init_data: initData,
            id: id
        })
    });

    loadWithdraws();
    loadDashboard();
}


// ---------------- REJECT ----------------
async function rejectWithdraw(id){

    await fetch(API + "/admin/withdraw/reject", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            init_data: initData,
            id: id
        })
    });

    loadWithdraws();
    loadDashboard();
}


// ---------------- AUTO REALTIME ----------------
function autoRefresh(){

    loadDashboard();
    loadUsers();
    loadWithdraws();
}

autoRefresh();
setInterval(autoRefresh, 15000); // каждые 15 сек

</script>

</body>
</html>
