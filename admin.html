<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:system-ui;
}

.container{
    padding:16px;
}

h2{
    margin:0 0 10px 0;
}

.card{
    background:#111;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#008cff;
    color:#fff;
    font-weight:700;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

th, td{
    padding:8px;
    border-bottom:1px solid #222;
    text-align:left;
}
</style>
</head>

<body>

<div class="container">

<h2>🛠 Admin Panel</h2>

<div class="card">
    <div id="status">Loading...</div>
</div>

<div class="card">
    <button onclick="loadUsers()">Refresh users</button>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Balance</th>
                <th>Last Claim</th>
            </tr>
        </thead>
        <tbody id="users"></tbody>
    </table>
</div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const API = "https://dogs-7ntt.onrender.com";

function isAdmin(){
    return tg.initDataUnsafe?.user?.id;
}

async function loadUsers(){

    try{

        const r = await fetch(API + "/admin/users", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                init_data: tg.initData
            })
        });

        const d = await r.json();

        if(!d.ok){
            document.getElementById("status").innerText = "❌ Not admin or error";
            return;
        }

        const tbody = document.getElementById("users");
        tbody.innerHTML = "";

        d.users.forEach(u => {

            const row = `
                <tr>
                    <td>${u[0]}</td>
                    <td>${u[1]}</td>
                    <td>${u[2]}</td>
                </tr>
            `;

            tbody.innerHTML += row;
        });

        document.getElementById("status").innerText =
            "✅ Loaded: " + d.users.length + " users";

    }catch(e){
        document.getElementById("status").innerText = "❌ Error loading";
    }
}

// auto load
loadUsers();

</script>

</body>
</html>
