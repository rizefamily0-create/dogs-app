<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:system-ui;
}

.container{
    padding:16px;
}

h2{
    margin:0 0 10px 0;
}

.card{
    background:#111;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    font-weight:700;
    margin-top:5px;
}

.approve{
    background:#00c853;
    color:#000;
}

.reject{
    background:#ff1744;
    color:#fff;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

th, td{
    padding:8px;
    border-bottom:1px solid #222;
    text-align:left;
}
</style>
</head>

<body>

<div class="container">

<h2>🛠 Admin Panel</h2>

<div class="card">
    <div id="status">Loading...</div>
</div>

<!-- USERS -->
<div class="card">
    <h3>👤 Users</h3>

    <button onclick="loadUsers()">
        Refresh users
    </button>

    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Balance</th>
                <th>Last Claim</th>
            </tr>
        </thead>

        <tbody id="users"></tbody>
    </table>
</div>

<!-- WITHDRAW -->
<div class="card">

    <h3>💸 Withdraw requests</h3>

    <button onclick="loadWithdraws()">
        Refresh withdraws
    </button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Amount</th>
                <th>Wallet</th>
                <th>Memo</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="withdraws"></tbody>
    </table>

</div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const API = "https://dogs-7ntt.onrender.com";

const initData = tg.initData;


// ---------------- USERS ----------------
async function loadUsers(){

    try{

        const r = await fetch(API + "/admin/users", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                init_data: initData
            })
        });

        const d = await r.json();

        if(!d.ok){
            document.getElementById("status").innerText =
                "❌ Not admin";

            return;
        }

        const tbody = document.getElementById("users");

        tbody.innerHTML = "";

        d.users.forEach(u => {

            tbody.innerHTML += `
                <tr>
                    <td>${u[0]}</td>
                    <td>${u[1]}</td>
                    <td>${u[2]}</td>
                </tr>
            `;
        });

        document.getElementById("status").innerText =
            "✅ Users loaded: " + d.users.length;

    }catch(e){

        document.getElementById("status").innerText =
            "❌ Users error";
    }
}


// ---------------- WITHDRAWS ----------------
async function loadWithdraws(){

    try{

        const r = await fetch(API + "/admin/withdraws", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                init_data: initData
            })
        });

        const d = await r.json();

        if(!d.ok){

            document.getElementById("status").innerText =
                "❌ Withdraw access denied";

            return;
        }

        const tbody = document.getElementById("withdraws");

        tbody.innerHTML = "";

        d.withdraws.forEach(w => {

            const id = w[0];
            const user_id = w[1];
            const amount = w[2];
            const wallet = w[3];
            const memo = w[4];
            const status = w[5];

            tbody.innerHTML += `
                <tr>
                    <td>${id}</td>
                    <td>${user_id}</td>
                    <td>${amount}</td>
                    <td>${wallet}</td>
                    <td>${memo}</td>
                    <td>${status}</td>
                    <td>
                        <button 
                            class="approve"
                            onclick="approve(${id})"
                        >
                            ✔
                        </button>

                        <button 
                            class="reject"
                            onclick="rejectWithdraw(${id})"
                        >
                            ✖
                        </button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("status").innerText =
            "💸 Withdraws loaded: " + d.withdraws.length;

    }catch(e){

        console.log(e);

        document.getElementById("status").innerText =
            "❌ Withdraw error";
    }
}


// ---------------- APPROVE ----------------
async function approve(id){

    await fetch(API + "/admin/withdraw/paid", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            init_data: initData,
            id: id
        })
    });

    loadWithdraws();
}


// ---------------- REJECT ----------------
async function rejectWithdraw(id){

    await fetch(API + "/admin/withdraw/reject", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            init_data: initData,
            id: id
        })
    });

    loadWithdraws();
}


// auto load
loadUsers();
loadWithdraws();

</script>

</body>
</html>
