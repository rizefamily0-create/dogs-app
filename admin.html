<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:system-ui;
}

.container{
    padding:16px;
    padding-bottom:90px;
}

h2,h3{
    margin:0 0 10px 0;
}

.card{
    background:#111;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    font-weight:700;
    margin-top:5px;
    cursor:pointer;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1a1a1a;
    color:#fff;
    margin-top:8px;
    box-sizing:border-box;
}

.approve{
    background:#00c853;
    color:#000;
}

.reject{
    background:#ff1744;
    color:#fff;
}

.blue{
    background:#008cff;
    color:#fff;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

th, td{
    padding:8px;
    border-bottom:1px solid #222;
    text-align:left;
}

.status{
    font-weight:700;
}

.pending{ color:#ffb300; }
.paid{ color:#00e676; }
.rejected{ color:#ff5252; }

.small{
    opacity:0.7;
    font-size:12px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:#0a0a0a;
    border-top:1px solid #111;
    padding:10px;
}

.nav-item{
    flex:1;
    text-align:center;
    color:#666;
    font-size:11px;
    cursor:pointer;
}

.nav-item span{
    display:block;
    font-size:20px;
}

.nav-item.active{
    color:#008cff;
}

.task-row{
    display:flex;
    gap:10px;
    align-items:center;
    margin-top:10px;
    background:#1a1a1a;
    padding:10px;
    border-radius:10px;
}

.task-row img{
    width:42px;
    height:42px;
    border-radius:50%;
}

.delete-btn{
    background:#ff1744;
    color:#fff;
}

</style>
</head>

<body>

<div class="container">

<h2>🛠 Admin Panel</h2>

<div class="card">
    <div id="status">Loading...</div>
</div>

<!-- ================= DASHBOARD PAGE ================= -->
<div id="dashboardPage" class="page active">

    <!-- DASHBOARD -->
    <div class="card">
        <h3>📊 Dashboard</h3>

        <div id="dashboard">Loading...</div>

        <button onclick="loadDashboard()">
            Refresh dashboard
        </button>
    </div>

    <!-- USERS -->
    <div class="card">

        <h3>👤 Users</h3>

        <button onclick="loadUsers()">
            Refresh users
        </button>

        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Balance</th>
                    <th>Last Claim</th>
                </tr>
            </thead>

            <tbody id="users"></tbody>
        </table>
    </div>

</div>

<!-- ================= WITHDRAW PAGE ================= -->
<div id="withdrawPage" class="page">

    <div class="card">

        <h3>💸 Withdraw requests</h3>

        <button onclick="loadWithdraws()">
            Refresh withdraws
        </button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Amount</th>
                    <th>Receive</th>
                    <th>Wallet</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="withdraws"></tbody>
        </table>

    </div>

</div>

<!-- ================= PROMO PAGE ================= -->
<div id="promoPage" class="page">

    <!-- CREATE PROMO -->
    <div class="card">

        <h3>🎁 Create Promo Code</h3>

        <input id="promoCode" placeholder="Promo code">

        <input id="promoReward" type="number" placeholder="Reward">

        <input id="promoActivations" type="number" placeholder="Activations">

        <button class="blue" onclick="createPromo()">
            Create promo
        </button>

    </div>

    <!-- ACTIVE PROMOS -->
    <div class="card">

        <h3>🎟 Active Promo Codes</h3>

        <div id="promoList">
            Loading...
        </div>

    </div>

</div>

<!-- ================= TASK PAGE ================= -->
<div id="taskPage" class="page">

    <!-- CREATE TASK -->
    <div class="card">

        <h3>📋 Create Task</h3>

        <input id="taskLink" placeholder="https://t.me/...">

        <input id="taskReward" type="number" placeholder="Reward">

        <input id="taskMax" type="number" placeholder="Max completions">

        <button class="blue" onclick="createTask()">
            Create task
        </button>

    </div>

    <!-- ACTIVE TASKS -->
    <div class="card">

        <h3>✅ Active Tasks</h3>

        <div id="taskList">
            Loading...
        </div>

    </div>

</div>

</div>

<!-- ================= NAVIGATION ================= -->

<div class="nav">

    <div class="nav-item active" onclick="openPage('dashboardPage', this)">
        <span>📊</span>
        Dashboard
    </div>

    <div class="nav-item" onclick="openPage('withdrawPage', this)">
        <span>💸</span>
        Withdraws
    </div>

    <div class="nav-item" onclick="openPage('promoPage', this)">
        <span>🎁</span>
        Promo
    </div>

    <div class="nav-item" onclick="openPage('taskPage', this)">
        <span>📋</span>
        Tasks
    </div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const API = "https://dogs-7ntt.onrender.com";
const initData = tg.initData;


// ================= NAVIGATION =================

function openPage(id, el){

    document.querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");

    document.querySelectorAll(".nav-item")
        .forEach(n => n.classList.remove("active"));

    el.classList.add("active");
}


// ================= DASHBOARD =================

async function loadDashboard(){

    try{

        const r = await fetch(API + "/admin/dashboard", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ init_data: initData })
        });

        const d = await r.json();

        if(!d.ok){

            document.getElementById("status").innerText =
                "❌ Not admin";

            return;
        }

        // ВОТ ЭТО ДОБАВЬ
        document.getElementById("status").innerText =
            "🟢 Admin authorized";

        document.getElementById("dashboard").innerHTML = `
            👤 Users: <b>${d.users}</b><br>
            💰 Total balance: <b>${d.balance}</b><br>
            ⏳ Pending withdraws: <b>${d.pending}</b><br>
            ✅ Paid today: <b>${d.paid_today}</b>
        `;

    }catch(e){

        console.log(e);

        document.getElementById("status").innerText =
            "❌ Connection error";
    }
}


// ================= USERS =================

async function loadUsers(){

    try{

        const r = await fetch(API + "/admin/users", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ init_data: initData })
        });

        const d = await r.json();

        const tbody = document.getElementById("users");
        tbody.innerHTML = "";

        d.users.forEach(u => {

            tbody.innerHTML += `
                <tr>
                    <td>${u[0]}</td>
                    <td>${u[1]}</td>
                    <td>${u[2]}</td>
                </tr>
            `;
        });

    }catch(e){
        console.log(e);
    }
}


// ================= WITHDRAWS =================

async function loadWithdraws(){

    try{

        const r = await fetch(API + "/admin/withdraw/list", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ init_data: initData })
        });

        const d = await r.json();

        const tbody = document.getElementById("withdraws");

        tbody.innerHTML = "";

        d.withdraws.forEach(w => {

            const statusClass =
                w.status === "paid" ? "paid" :
                w.status === "rejected" ? "rejected" : "pending";

            tbody.innerHTML += `
                <tr>

                    <td>${w.id}</td>

                    <td>${w.user_id}</td>

                    <td>${w.amount}</td>

                    <td>${w.receive_amount}</td>

                    <td>

                        <div style="max-width:220px;word-break:break-all;">

                            <b>Wallet:</b><br>
                            ${w.wallet || "-"}

                            ${
                                w.memo
                                ?
                                `
                                <div style="margin-top:6px;">
                                    <b>Memo:</b><br>
                                    ${w.memo}
                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                    </td>

                    <td class="status ${statusClass}">
                        ${w.status}
                    </td>

                    <td>

                        <button
                            class="approve"
                            onclick="approve(${w.id})"
                        >
                            ✔
                        </button>

                        <button
                            class="reject"
                            onclick="rejectWithdraw(${w.id})"
                        >
                            ✖
                        </button>

                    </td>

                </tr>
            `;
        });

    }catch(e){
        console.log(e);
    }
}


// ================= APPROVE =================

async function approve(id){

    await fetch(API + "/admin/withdraw/approve", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            init_data: initData,
            id
        })
    });

    loadWithdraws();
    loadDashboard();
}


// ================= REJECT =================

async function rejectWithdraw(id){

    await fetch(API + "/admin/withdraw/reject", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            init_data: initData,
            id
        })
    });

    loadWithdraws();
    loadDashboard();
}


// ================= CREATE PROMO =================

async function createPromo(){

    const code = document.getElementById("promoCode").value.trim();
    const reward = document.getElementById("promoReward").value;
    const activations = document.getElementById("promoActivations").value;

    const r = await fetch(API + "/admin/promo/create", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            init_data: initData,
            code,
            reward,
            activations
        })
    });

    const d = await r.json();

    if(d.ok){

        tg.showPopup({
            message:"Promo created"
        });

        document.getElementById("promoCode").value = "";
        document.getElementById("promoReward").value = "";
        document.getElementById("promoActivations").value = "";

        loadPromos();
    }
}


// ================= LOAD PROMOS =================

async function loadPromos(){

    const r = await fetch(API + "/admin/promo/list", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            init_data:initData
        })
    });

    const d = await r.json();

    const box = document.getElementById("promoList");

    box.innerHTML = "";

    d.promos.forEach(p => {

        box.innerHTML += `
            <div class="task-row">

                <div style="flex:1;">
                    <b>${p.code}</b><br>

                    Reward: ${p.reward}<br>

                    Remaining: ${p.activations}
                </div>

                <button
                    class="delete-btn"
                    onclick="deletePromo(${p.id})"
                >
                    Delete
                </button>

            </div>
        `;
    });
}


// ================= DELETE PROMO =================

async function deletePromo(id){

    await fetch(API + "/admin/promo/delete", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            init_data:initData,
            id
        })
    });

    loadPromos();
}


// ================= CREATE TASK =================

async function createTask(){

    const link = document.getElementById("taskLink").value.trim();

    const reward = document.getElementById("taskReward").value;

    const maxCompletions =
        document.getElementById("taskMax").value;

    if(!link){
        return;
    }

    const r = await fetch(API + "/admin/task/create", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            init_data:initData,
            link,
            reward,
            max_completions:maxCompletions
        })
    });

    const d = await r.json();

    if(d.ok){

        tg.showPopup({
            message:"Task created"
        });

        document.getElementById("taskLink").value = "";
        document.getElementById("taskReward").value = "";
        document.getElementById("taskMax").value = "";

        loadTasks();

    }else{

        tg.showPopup({
            message:d.error || "Error"
        });
    }
}

// ================= LOAD TASKS =================

async function loadTasks(){

    const r = await fetch(API + "/admin/task/list", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            init_data:initData
        })
    });

    const d = await r.json();

    const box = document.getElementById("taskList");

    box.innerHTML = "";

    d.tasks.forEach(t => {

        box.innerHTML += `
            <div class="task-row">

                <img src="${t.avatar}">

                <div style="flex:1;">

                    <b>${t.title}</b><br>

                    Reward: ${t.reward}<br>

                    ${t.completed_count}/${t.max_completions}

                </div>

                <button
                    class="delete-btn"
                    onclick="deleteTask(${t.id})"
                >
                    Delete
                </button>

            </div>
        `;
    });
}


// ================= DELETE TASK =================

async function deleteTask(id){

    await fetch(API + "/admin/task/delete", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            init_data:initData,
            id
        })
    });

    loadTasks();
}


// ================= AUTO REFRESH =================

function autoRefresh(){

    loadDashboard();
    loadUsers();
    loadWithdraws();
    loadPromos();
    loadTasks();
}

autoRefresh();

setInterval(autoRefresh, 15000);

</script>

</body>
</html>
