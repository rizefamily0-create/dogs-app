<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:system-ui;
}

.container{
    padding:16px;
}

h2{
    margin:0 0 10px 0;
}

.card{
    background:#111;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    font-weight:700;
    margin-top:5px;
}

.approve{
    background:#00c853;
    color:#000;
}

.reject{
    background:#ff1744;
    color:#fff;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

th, td{
    padding:8px;
    border-bottom:1px solid #222;
    text-align:left;
}
</style>
</head>

<body>

<div class="container">

<h2>🛠 Admin Panel</h2>

<div class="card">
    <div id="status">Loading...</div>
</div>

<!-- USERS -->
<div class="card">
    <h3>👤 Users</h3>
    <button onclick="loadUsers()">Refresh users</button>

    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Balance</th>
                <th>Last Claim</th>
            </tr>
        </thead>
        <tbody id="users"></tbody>
    </table>
</div>

<!-- WITHDRAW -->
<div class="card">
    <h3>💸 Withdraw requests</h3>
    <button onclick="loadWithdraws()">Refresh withdraws</button>

    <table>
        <thead>
            <tr>
                <th>User</th>
                <th>Amount</th>
                <th>Wallet</th>
                <th>Memo</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="withdraws"></tbody>
    </table>
</div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const API = "https://dogs-7ntt.onrender.com";

let initData = tg.initData;

// ---------------- USERS ----------------
async function loadUsers(){

    const r = await fetch(API + "/admin/users", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ init_data: initData })
    });

    const d = await r.json();

    if(!d.ok){
        document.getElementById("status").innerText = "❌ Not admin";
        return;
    }

    const tbody = document.getElementById("users");
    tbody.innerHTML = "";

    d.users.forEach(u => {
        tbody.innerHTML += `
            <tr>
                <td>${u[0]}</td>
                <td>${u[1]}</td>
                <td>${u[2]}</td>
            </tr>
        `;
    });

    document.getElementById("status").innerText =
        "✅ Users loaded: " + d.users.length;
}


// ---------------- WITHDRAW ----------------
async function loadWithdraws(){

    const r = await fetch(API + "/admin/withdraws", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ init_data: initData })
    });

    const d = await r.json();

    if(!d.ok){
        document.getElementById("status").innerText = "❌ Not admin";
        return;
    }

    const tbody = document.getElementById("withdraws");
    tbody.innerHTML = "";

    d.withdraws.forEach(w => {

        tbody.innerHTML += `
            <tr>
                <td>${w.user_id}</td>
                <td>${w.amount}</td>
                <td>${w.wallet}</td>
                <td>${w.memo}</td>
                <td>${w.status}</td>
                <td>
                    <button class="approve" onclick="approve(${w.id})">✔</button>
                    <button class="reject" onclick="reject(${w.id})">✖</button>
                </td>
            </tr>
        `;
    });

    document.getElementById("status").innerText =
        "💸 Withdraws: " + d.withdraws.length;
}


// ---------------- ACTIONS ----------------
async function approve(id){
    await fetch(API + "/admin/withdraw/approve", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            init_data: initData,
            id
        })
    });

    loadWithdraws();
}

async function reject(id){
    await fetch(API + "/admin/withdraw/reject", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            init_data: initData,
            id
        })
    });

    loadWithdraws();
}


// auto load
loadUsers();
loadWithdraws();

</script>

</body>
</html>
