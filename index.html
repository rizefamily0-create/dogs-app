<!DOCTYPE html>
<html>
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background: radial-gradient(circle at top, #1a0f2e, #0b0c10);
    color:white;
    font-family:system-ui;
    height:100vh;
    overflow:hidden;
}

*{ box-sizing:border-box; }

/* ---------- APP ---------- */
.app{
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:16px;
    padding-bottom:90px;
}

/* ---------- PAGE ---------- */
.page{
    display:none;
    flex-direction:column;
    height:100%;
    overflow-y:auto;
}
.page.active{
    display:flex;
}

/* ---------- CARD ---------- */
.card{
    background: linear-gradient(145deg,#141420,#0f0f18);
    border-radius:18px;
    padding:14px;
    margin-top:12px;
    box-shadow:0 0 25px rgba(0,0,0,0.6);
}

/* ---------- BALANCE ---------- */
.balance{
    font-size:28px;
    text-align:center;
    font-weight:700;
    background: linear-gradient(90deg,#b16cff,#ff4fd8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* ---------- CENTER ---------- */
.center{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* ---------- DOG ---------- */
.dog img{
    width:140px;
    border-radius:20px;
    box-shadow:0 0 40px rgba(177,108,255,0.4);
}

/* ---------- BUTTON ---------- */
button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    background: linear-gradient(90deg,#7a5cff,#ff4fd8);
    color:white;
    font-weight:800;
    letter-spacing:1px;
    font-size:16px;
    box-shadow:0 0 20px rgba(255,79,216,0.4);
}

button:disabled{
    background:#2a2a2a;
    color:#777;
    box-shadow:none;
}

/* ---------- CLAIM BTN ---------- */
.claim-btn{
    margin-top:auto;
    font-size:18px;
}

/* ---------- INPUT ---------- */
input{
    width:100%;
    padding:14px;
    border-radius:16px;
    border:none;
    background:#15161c;
    color:white;
    margin-top:10px;
}

/* ---------- HISTORY ---------- */
.history-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #222;
    font-size:13px;
}

.status.pending{color:#ffaa00;}
.status.done{color:#00ff99;}
.status.rejected{color:#ff4d4d;}

/* ---------- NAV ---------- */
.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:rgba(20,20,30,0.9);
    border-top:1px solid #222;
    padding:10px;
}

.nav-item{
    flex:1;
    text-align:center;
    color:#888;
    font-size:11px;
    cursor:pointer;
}

.nav-item span{
    display:block;
    font-size:22px;
}

.nav-item.active{
    color:#ff4fd8;
}
</style>
</head>

<body>

<div class="app">

<!-- FAUCET -->
<div id="faucet" class="page active">

    <div class="card">
        <div id="balance1" class="balance">0 DOGS</div>
    </div>

    <div class="center">
        <div class="dog">
            <img src="https://i.imgur.com/3G5bQ9V.png">
        </div>
    </div>

    <button id="claimBtn" class="claim-btn" onclick="claim()">Loading...</button>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="page">

    <div class="card">
        <div id="balance2" class="balance">0 DOGS</div>
    </div>

    <div class="card">
        <input id="wallet" placeholder="TON wallet">
        <input id="memo" placeholder="Memo">
        <input id="amount" placeholder="Amount (TON)">
    </div>

    <button onclick="withdraw()">WITHDRAW</button>

    <div class="card">
        <div style="font-weight:700; margin-bottom:10px;">Withdraw history</div>
        <div id="historyList"></div>
    </div>

</div>

<!-- TASKS (вернул) -->
<div id="tasks" class="page">
    <div class="card">
        <div class="balance">SOON</div>
    </div>
</div>

<!-- REF (вернул) -->
<div id="ref" class="page">
    <div class="card">
        <div class="balance">SOON</div>
    </div>
</div>

</div>

<!-- NAV -->
<div class="nav">
    <div class="nav-item active" onclick="tab('faucet', this)">
        <span>🐶</span>Claim
    </div>
    <div class="nav-item" onclick="tab('withdraw', this)">
        <span>💸</span>Withdraw
    </div>
    <div class="nav-item" onclick="tab('tasks', this)">
        <span>📋</span>Tasks
    </div>
    <div class="nav-item" onclick="tab('ref', this)">
        <span>👥</span>Ref
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let cooldown = 0;
let timerInterval = null;

// ---------- USER ----------
function getUserId(){
    try {
        return tg.initDataUnsafe?.user?.id || 1;
    } catch {
        return 1;
    }
}

// ---------- NAV ----------
function tab(id, el){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
    if(el) el.classList.add("active");
}

// ---------- TIMER (в кнопке) ----------
function startTimer(seconds){
    cooldown = seconds;

    const btn = document.getElementById("claimBtn");
    btn.disabled = true;

    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
        if(cooldown <= 0){
            btn.innerText = "CLAIM";
            btn.disabled = false;
            clearInterval(timerInterval);
            return;
        }

        let m = Math.floor(cooldown / 60);
        let s = cooldown % 60;

        btn.innerText = `${m}:${s.toString().padStart(2,"0")}`;

        cooldown--;
    }, 1000);
}

// ---------- STATUS ----------
async function loadStatus(){
    try{
        const r = await fetch("https://dogs-7ntt.onrender.com/status",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({user_id:getUserId()})
        });

        const d = await r.json();

        document.getElementById("balance1").innerText = d.balance + " DOGS";
        document.getElementById("balance2").innerText = d.balance + " DOGS";

        if(d.remaining > 0){
            startTimer(d.remaining);
        }else{
            const btn = document.getElementById("claimBtn");
            btn.innerText = "CLAIM";
            btn.disabled = false;
        }

    }catch(e){
        console.log("status error", e);
    }
}

// ---------- CLAIM ----------
async function claim(){
    try{
        const r = await fetch("https://dogs-7ntt.onrender.com/claim",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                user_id:getUserId(),
                device:navigator.userAgent,
                ip:"tg"
            })
        });

        const d = await r.json();

        alert(d.ok ? "+"+d.reward+" DOGS" : d.error);

        loadStatus();

    }catch(e){
        alert("Server error");
    }
}

// ---------- WITHDRAW ----------
async function withdraw(){
    try{
        const r = await fetch("https://dogs-7ntt.onrender.com/withdraw",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                user_id:getUserId(),
                wallet:document.getElementById("wallet").value,
                memo:document.getElementById("memo").value,
                amount:document.getElementById("amount").value
            })
        });

        const d = await r.json();

        alert(d.ok ? "Sent" : d.error);

        if(d.ok) loadStatus();

    }catch(e){
        alert("Server error");
    }
}

// ---------- INIT ----------
loadStatus();
</script>

</body>
</html>
