<!DOCTYPE html>
<html>
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:-apple-system, system-ui;
    height:100vh;
    overflow:hidden;
}

*{ box-sizing:border-box; }

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:16px;
    padding-bottom:90px;
}

.page{
    display:none;
    flex-direction:column;
    height:100%;
    overflow-y:auto;
}
.page.active{ display:flex; }

.fade{
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:999;
}
.fade.show{ opacity:0.5; }

.card{
    background:#0b0b0c;
    border-radius:16px;
    padding:16px;
    margin-top:12px;
}

.balance{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:700;
}

.balance-left{ display:flex; align-items:baseline; }

.balance .num{ font-size:30px; }
.balance .unit{ font-size:14px; opacity:0.7; margin-left:6px; }

.user{ display:flex; align-items:center; gap:8px; }

.user img{
    width:36px;
    height:36px;
    border-radius:50%;
}

.center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:#008cff;
    color:white;
    font-weight:700;
    font-size:16px;
}

button:disabled{
    background:#1a1a1a;
    color:#555;
}

.claim-btn{
    margin-top:auto;
    font-size:18px;
}

input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:none;
    background:#111;
    color:white;
    margin-top:10px;
}

.history-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #111;
    font-size:13px;
}

.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:#0a0a0a;
    border-top:1px solid #111;
    padding:10px;
}

.nav-item{
    flex:1;
    text-align:center;
    color:#666;
    font-size:11px;
    cursor:pointer;
}

.nav-item span{
    display:block;
    font-size:22px;
}

.nav-item.active{
    color:#008cff;
}

/* X3 MODAL */
#x3modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    z-index:9999;
    justify-content:center;
    align-items:center;
}
</style>
</head>

<body>

<div class="fade" id="fade"></div>

<div class="app">

<!-- FAUCET -->
<div id="faucet" class="page active">
    <div class="card">
        <div id="balance1" class="balance">
            <div class="balance-left">
                <span class="num">0</span>
                <span class="unit">DOGS</span>
            </div>
            <div class="user">
                <img id="avatar" src="">
            </div>
        </div>
    </div>

    <div class="center">
        <video src="dog.mp4" autoplay loop muted playsinline style="width:400px;border-radius:12px;"></video>
    </div>

    <button id="claimBtn" class="claim-btn" onclick="claim()">Loading...</button>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="page">
    <div class="card">
        <div id="balance2" class="balance">
            <div class="balance-left">
                <span class="num">0</span>
                <span class="unit">DOGS</span>
            </div>
            <div class="user">
                <img id="avatar2" src="">
            </div>
        </div>
    </div>

    <div class="card">
        <input id="wallet" placeholder="TON wallet">
        <input id="memo" placeholder="Memo">
        <input id="amount" placeholder="Amount (TON)">
    </div>

    <button onclick="withdraw()">WITHDRAW</button>

    <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">Withdraw history</div>
        <div id="historyList"></div>
    </div>
</div>

<!-- TASKS -->
<div id="tasks" class="page">
    <div class="card">
        <div class="balance"><span class="num">SOON</span></div>
    </div>
</div>

<!-- REF -->
<div id="ref" class="page">
    <div class="card">
        <div class="balance"><span class="num">SOON</span></div>
    </div>
</div>

</div>

<!-- NAV (НЕ ТРОГАЛ) -->
<div class="nav">
    <div class="nav-item active" onclick="tab('faucet', this)">
        <span>🐶</span>Claim
    </div>
    <div class="nav-item" onclick="tab('withdraw', this)">
        <span>💸</span>Withdraw
    </div>
    <div class="nav-item" onclick="tab('tasks', this)">
        <span>📋</span>Tasks
    </div>
    <div class="nav-item" onclick="tab('ref', this)">
        <span>👥</span>Ref
    </div>
</div>

<!-- X3 -->
<div id="x3modal">
    <div style="background:#111;padding:20px;border-radius:16px;text-align:center;width:80%;">
        <div style="margin-bottom:15px;font-size:18px;">Multiply reward x3?</div>

        <button onclick="watchX3()" style="margin-bottom:10px;">Watch ad x3</button>
        <button onclick="closeX3()" style="background:#333;">No thanks</button>
    </div>
</div>

<script>

const AdController = window.Adsgram.init({ blockId: "29572" });    
const tg = window.Telegram.WebApp;
tg.expand();

let cooldown = 0;
let timerInterval = null;

function getUserId(){
    try { return tg.initDataUnsafe?.user?.id || 1; }
    catch { return 1; }
}

function loadUser(){
    try{
        const user = tg.initDataUnsafe?.user;
        if(user?.photo_url){
            avatar.src = user.photo_url;
            avatar2.src = user.photo_url;
        }
    }catch(e){}
}

function tab(id, el){
    const fade = document.getElementById("fade");
    fade.classList.add("show");

    setTimeout(()=>{
        document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
        document.getElementById(id).classList.add("active");

        document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
        if(el) el.classList.add("active");

        fade.classList.remove("show");
    },150);
}

function startTimer(seconds){
    cooldown = seconds;
    const btn = claimBtn;
    btn.disabled = true;

    clearInterval(timerInterval);

    timerInterval = setInterval(()=>{
        if(cooldown <= 0){
            btn.innerText = "CLAIM";
            btn.disabled = false;
            clearInterval(timerInterval);
            return;
        }

        let m = Math.floor(cooldown / 60);
        let s = cooldown % 60;

        btn.innerText = `${m}:${s.toString().padStart(2,"0")}`;
        cooldown--;
    },1000);
}

function setBalance(id, value){
    document.getElementById(id).querySelector(".num").innerText = value;
}

async function loadStatus(){
    const r = await fetch("https://dogs-7ntt.onrender.com/status",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({user_id:getUserId()})
    });

    const d = await r.json();

    setBalance("balance1", d.balance);
    setBalance("balance2", d.balance);

    if(d.remaining > 0){
        startTimer(d.remaining);
    }else{
        claimBtn.innerText = "CLAIM";
        claimBtn.disabled = false;
    }
}

// CLAIM (без рекламы)
async function claim(){
    const btn = claimBtn;

    try{
        btn.disabled = true;
        btn.innerText = "Loading...";

        const r = await fetch("https://dogs-7ntt.onrender.com/claim",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                user_id:getUserId(),
                device:navigator.userAgent,
                ip:"tg"
            })
        });

        const d = await r.json();

        if(d.ok){
            alert("+"+d.reward+" DOGS");
            showX3();
        }else{
            alert(d.error);
        }

        loadStatus();

    }catch(e){
        alert("Error");
        btn.disabled = false;
        btn.innerText = "CLAIM";
    }
}

function showX3(){
    x3modal.style.display = "flex";
}

function closeX3(){
    x3modal.style.display = "none";
}

async function watchX3(){
    try{
        const result = await AdController.show();

        if(result !== "completed"){
            alert("Ad not completed");
            return;
        }

        const r = await fetch("https://dogs-7ntt.onrender.com/claim_x3",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                user_id:getUserId(),
                ad_watched:true
            })
        });

        const d = await r.json();

        if(d.ok){
            alert("+"+d.reward+" DOGS (x3)");
            loadStatus();
        }else{
            alert(d.error);
        }

    }catch(e){
        alert("Error");
    }

    closeX3();
}

async function withdraw(){
    const r = await fetch("https://dogs-7ntt.onrender.com/withdraw",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            user_id:getUserId(),
            wallet:wallet.value,
            memo:memo.value,
            amount:amount.value
        })
    });

    const d = await r.json();
    alert(d.ok ? "Sent" : d.error);
}

loadUser();
loadStatus();

</script>

</body>
</html>
