<!DOCTYPE html>
<html>
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:-apple-system, system-ui;
    height:100vh;
    overflow:hidden;
}

*{ box-sizing:border-box; }

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:16px;
    padding-bottom:90px;
}

.page{
    display:none;
    flex-direction:column;
    height:100%;
    overflow-y:auto;
}

.page.active{
    display:flex;
}

.card{
    background:#0b0b0c;
    border-radius:16px;
    padding:16px;
    margin-top:12px;
}

.balance{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:700;
}

.balance-left{
    display:flex;
    align-items:baseline;
}

.balance .num{
    font-size:30px;
}

.balance .unit{
    font-size:14px;
    opacity:0.7;
    margin-left:6px;
}

.user{
    display:flex;
    align-items:center;
    gap:8px;
}

.user img{
    width:36px;
    height:36px;
    border-radius:50%;
}

.center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:#008cff;
    color:white;
    font-weight:700;
    font-size:16px;
}

button:disabled{
    background:#1a1a1a;
    color:#555;
}

.claim-btn{
    margin-top:auto;
    font-size:18px;
}

input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:none;
    background:#111;
    color:white;
    margin-top:10px;
}

.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:#0a0a0a;
    border-top:1px solid #111;
    padding:10px;
}

.nav-item{
    flex:1;
    text-align:center;
    color:#666;
    font-size:11px;
    cursor:pointer;
}

.nav-item span{
    display:block;
    font-size:22px;
}

.nav-item.active{
    color:#008cff;
}

#x3modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.x3box{
    background:#111;
    padding:20px;
    border-radius:16px;
    text-align:center;
    width:80%;
}

.history-item{
    background:#111;
    border-radius:12px;
    padding:12px;
    margin-top:10px;
    font-size:14px;
}

.status{
    margin-top:8px;
    font-weight:700;
}

.pending{
    color:#ff9800;
}

.paid{
    color:#00e676;
}

.rejected{
    color:#ff1744;
}
</style>
</head>

<body>

<div class="app">

<!-- FAUCET -->
<div id="faucet" class="page active">

    <div class="card">
        <div id="balance1" class="balance">
            <div class="balance-left">
                <span class="num">0</span>
                <span class="unit">DOGS</span>
            </div>

            <div class="user">
                <img id="avatar">
            </div>
        </div>
    </div>

    <div class="center">
        <video
            src="dog.mp4"
            autoplay
            loop
            muted
            playsinline
            style="width:400px;border-radius:12px;"
        ></video>
    </div>

    <button id="claimBtn" class="claim-btn" onclick="claim()">
        Loading...
    </button>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="page">

    <div class="card">
        <div id="balance2" class="balance">
            <div class="balance-left">
                <span class="num">0</span>
                <span class="unit">DOGS</span>
            </div>

            <div class="user">
                <img id="avatar2">
            </div>
        </div>
    </div>

    <div class="card">
        <input id="wallet" placeholder="TON wallet">
        <input id="memo" placeholder="Memo (optional)">
        <input id="amount" type="number" placeholder="Amount">
    </div>

    <button onclick="withdraw()">WITHDRAW</button>

    <!-- HISTORY -->
    <div class="card">
        <h3 style="margin-top:0;">📜 Withdraw history</h3>

        <div id="withdrawHistory">
            No withdraws
        </div>
    </div>

</div>

<!-- TASKS -->
<div id="tasks" class="page">
    <div class="card">
        <div class="balance">
            <span class="num">SOON</span>
        </div>
    </div>
</div>

<!-- REF -->
<div id="ref" class="page">
    <div class="card">
        <div class="balance">
            <span class="num">SOON</span>
        </div>
    </div>
</div>

</div>

<!-- NAV -->
<div class="nav">

    <div class="nav-item active" onclick="tab('faucet', this)">
        <span>🐶</span>
        Claim
    </div>

    <div class="nav-item" onclick="tab('withdraw', this)">
        <span>💸</span>
        Withdraw
    </div>

    <div class="nav-item" onclick="tab('tasks', this)">
        <span>📋</span>
        Tasks
    </div>

    <div class="nav-item" onclick="tab('ref', this)">
        <span>👥</span>
        Ref
    </div>

</div>

<!-- X3 -->
<div id="x3modal">

    <div class="x3box">

        <div style="margin-bottom:15px;font-size:18px;">
            Multiply reward x3?
        </div>

        <button onclick="watchX3()" style="margin-bottom:10px;">
            Watch ad x3
        </button>

        <button onclick="closeX3()" style="background:#333;">
            No thanks
        </button>

    </div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const API = "https://dogs-7ntt.onrender.com";

const AdController = window.Adsgram.init({
    blockId: "29588"
});

let cooldown = 0;
let timerInterval = null;

// ---------------- TABS ----------------

function tab(id, el){

    document.querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");

    document.querySelectorAll(".nav-item")
        .forEach(n => n.classList.remove("active"));

    el.classList.add("active");

    if(id === "withdraw"){
        loadWithdrawHistory();
    }
}

// ---------------- X3 ----------------

function showX3(){
    document.getElementById("x3modal").style.display = "flex";
}

function closeX3(){
    document.getElementById("x3modal").style.display = "none";
}

// ---------------- USER ----------------

function loadUser(){

    const user = tg.initDataUnsafe?.user;

    if(user?.photo_url){
        avatar.src = user.photo_url;
        avatar2.src = user.photo_url;
    }
}

// ---------------- BALANCE ----------------

function setBalance(id, value){

    document.getElementById(id)
        .querySelector(".num")
        .innerText = value;
}

// ---------------- STATUS ----------------

async function loadStatus(){

    const r = await fetch(API + "/status", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            init_data: tg.initData
        })
    });

    const d = await r.json();

    setBalance("balance1", d.balance);
    setBalance("balance2", d.balance);

    const btn = claimBtn;

    if(d.remaining > 0){

        cooldown = d.remaining;

        btn.disabled = true;

        clearInterval(timerInterval);

        timerInterval = setInterval(()=>{

            if(cooldown <= 0){

                btn.innerText = "CLAIM";
                btn.disabled = false;

                clearInterval(timerInterval);

                return;
            }

            let m = Math.floor(cooldown / 60);
            let s = cooldown % 60;

            btn.innerText =
                `${m}:${s.toString().padStart(2,"0")}`;

            cooldown--;

        },1000);

    }else{

        btn.innerText = "CLAIM";
        btn.disabled = false;
    }
}

// ---------------- CLAIM ----------------

async function claim(){

    const btn = claimBtn;

    btn.disabled = true;
    btn.innerText = "Loading...";

    try{

        const r = await fetch(API + "/claim", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                init_data: tg.initData,
                device: navigator.userAgent
            })
        });

        const d = await r.json();

        if(d.ok){

            tg.showPopup?.({
                message: "+" + d.reward + " DOGS"
            });

            loadStatus();

            setTimeout(()=>{
                showX3();
            },300);

        }else{

            tg.showPopup?.({
                message: d.error
            });

            btn.disabled = false;
            btn.innerText = "CLAIM";
        }

    }catch(e){

        btn.disabled = false;
        btn.innerText = "CLAIM";
    }
}

// ---------------- X3 ----------------

async function watchX3(){

    try{

        await AdController.show();

        tg.showPopup?.({
            message:"Reward activated"
        });

        setTimeout(loadStatus, 1500);
        setTimeout(loadStatus, 3000);

    }catch(e){

        tg.showPopup?.({
            message:"Ad failed"
        });
    }

    closeX3();
}

// ---------------- WITHDRAW ----------------

async function withdraw(){

    const wallet = document.getElementById("wallet").value.trim();
    const memo = document.getElementById("memo").value.trim();
    const amount = document.getElementById("amount").value.trim();

    // wallet validation
    if(wallet.length < 20){

        tg.showPopup?.({
            message:"Enter valid TON wallet"
        });

        return;
    }

    // amount validation
    if(!amount || Number(amount) <= 0){

        tg.showPopup?.({
            message:"Enter amount"
        });

        return;
    }

    const r = await fetch(API + "/withdraw", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            init_data: tg.initData,
            wallet,
            memo,
            amount
        })
    });

    const d = await r.json();

    if(d.ok){

        tg.showPopup?.({
            message:"Withdraw request created"
        });

        // clear inputs
        document.getElementById("wallet").value = "";
        document.getElementById("memo").value = "";
        document.getElementById("amount").value = "";

        // update ui
        loadStatus();
        loadWithdrawHistory();

    }else{

        tg.showPopup?.({
            message:d.error
        });
    }
}

// ---------------- HISTORY ----------------

async function loadWithdrawHistory(){

    try{

        const r = await fetch(API + "/withdraw/history", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                init_data: tg.initData
            })
        });

        const d = await r.json();

        const box = document.getElementById("withdrawHistory");

        box.innerHTML = "";

        if(!d.history || d.history.length === 0){

            box.innerHTML = "No withdraws";

            return;
        }

        d.history.forEach(w => {

            let statusClass = "pending";

            if(w.status === "paid"){
                statusClass = "paid";
            }

            if(w.status === "rejected"){
                statusClass = "rejected";
            }

            box.innerHTML += `
                <div class="history-item">

                    <div><b>Amount:</b> ${w.amount}</div>

                    <div style="margin-top:6px;">
                        <b>Wallet:</b><br>
                        ${w.wallet}
                    </div>

                    ${
                        w.memo
                        ?
                        `<div style="margin-top:6px;">
                            <b>Memo:</b> ${w.memo}
                        </div>`
                        :
                        ""
                    }

                    <div class="status ${statusClass}">
                        ${w.status}
                    </div>

                </div>
            `;
        });

    }catch(e){

        console.log(e);
    }
}

// ---------------- INIT ----------------

loadUser();
loadStatus();
loadWithdrawHistory();

</script>

</body>
</html>
