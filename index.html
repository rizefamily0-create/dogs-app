<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#0b0c10;
    color:white;
    font-family:system-ui;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:16px;
    padding-bottom:90px;
    box-sizing:border-box;
}

.page{display:none;}
.page.active{display:block;}

.balance{
    font-size:34px;
    text-align:center;
    color:#f5c542;
}

.timer{
    text-align:center;
    color:#aaa;
    font-size:13px;
}

.dog{
    display:flex;
    justify-content:center;
    margin:20px 0;
}

.dog img{
    width:140px;
    border-radius:18px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#f5c542;
    font-weight:800;
}

input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:#15161c;
    color:white;
    margin-top:10px;
}

.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:#15161c;
    border-top:1px solid #222;
    padding:10px;
}

.nav-item{
    flex:1;
    text-align:center;
    color:#aaa;
    font-size:11px;
    cursor:pointer;
}

.nav-item span{
    display:block;
    font-size:22px;
}

.nav-item.active{
    color:#f5c542;
}
</style>
</head>

<body>

<div class="app">

<!-- FAUCET -->
<div id="faucet" class="page active">
    <div id="balance1" class="balance">0 DOGS</div>
    <div class="timer">Tap to claim</div>

    <div class="dog">
        <img src="https://i.imgur.com/3G5bQ9V.png">
    </div>

    <button onclick="claim()">CLAIM</button>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="page">
    <div id="balance2" class="balance">0 DOGS</div>

    <input id="wallet" placeholder="TON wallet">
    <input id="memo" placeholder="Memo">

    <button onclick="withdraw()">WITHDRAW</button>
</div>

<!-- SOON -->
<div id="tasks" class="page">
    <div class="balance">SOON</div>
</div>

<div id="ref" class="page">
    <div class="balance">SOON</div>
</div>

</div>

<!-- NAV -->
<div class="nav">
    <div class="nav-item active" onclick="tab('faucet', this)">
        <span>🐶</span>Claim
    </div>

    <div class="nav-item" onclick="tab('withdraw', this)">
        <span>💸</span>Withdraw
    </div>

    <div class="nav-item" onclick="soon()">
        <span>📋</span>Tasks
    </div>

    <div class="nav-item" onclick="soon()">
        <span>👥</span>Ref
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// ---------- SAFE USER ----------
function getUserId(){
    try {
        return tg.initDataUnsafe?.user?.id || 1;
    } catch {
        return 1;
    }
}

// ---------- NAV ----------
function tab(id, el){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
    if(el) el.classList.add("active");
}

function soon(){
    alert("Coming soon");
}

// ---------- BALANCE ----------
async function loadBalance(){
    try{
        const r = await fetch("https://dogs-7ntt.onrender.com/balance",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                user_id: getUserId()
            })
        });

        const d = await r.json();

        document.getElementById("balance1").innerText = d.balance + " DOGS";
        document.getElementById("balance2").innerText = d.balance + " DOGS";

    }catch(e){
        console.log("balance error", e);
    }
}

// ---------- CLAIM ----------
async function claim(){
    console.log("claim clicked");

    try{
        const r = await fetch("https://dogs-7ntt.onrender.com/claim",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                user_id: getUserId(),
                device: navigator.userAgent,
                ip: "tg"
            })
        });

        const d = await r.json();
        console.log(d);

        alert(d.ok ? "+" + d.reward + " DOGS" : d.error);

        if(d.ok) loadBalance();

    }catch(e){
        console.log(e);
        alert("Server error");
    }
}

// ---------- WITHDRAW ----------
async function withdraw(){
    console.log("withdraw clicked");

    try{
        const r = await fetch("https://dogs-7ntt.onrender.com/withdraw",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                user_id: getUserId(),
                wallet: document.getElementById("wallet").value,
                memo: document.getElementById("memo").value
            })
        });

        const d = await r.json();
        console.log(d);

        alert(d.ok ? "Sent" : d.error);

        if(d.ok) loadBalance();

    }catch(e){
        console.log(e);
        alert("Server error");
    }
}

// ---------- INIT ----------
loadBalance();
</script>

</body>
</html>
